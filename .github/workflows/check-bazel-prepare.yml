name: Check Bazel Prepare
on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: check-bazel-prepare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Bazel Prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: 1.27.3
          cache: false
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@8310a45e30297e76bc8fbae427fb6068efa01eb8 # 0.16.0
        with:
          bazelisk-cache: false
          repository-cache: false
          external-cache: false
      - name: Check Bazel Prepare
        shell: bash
        run: |
          set -euo pipefail
          # Avoid the TiDB CI path that assumes Jenkins-owned temp directories.
          unset CI
          make check-bazel-prepare
      - name: Test x/tools export-data formats
        shell: bash
        run: |
          set -euo pipefail
          unset CI
          # External tests are not included by TiDB's //... target pattern.
          bazel test @org_golang_x_tools//internal/pkgbits:pkgbits_test \
            --test_output=all \
            --nocache_test_results \
            --flaky_test_attempts=1 \
            --test_arg=-test.v
      - name: Check Linux cgo test linking
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          unset CI
          # Link a test executable that failed in Jenkins; do not run business tests.
          bazel build --config=ci //pkg/sessionctx/stmtctx:stmtctx_test \
            --linkopt=-Wl,-z,nocopyreloc \
            --jobs=2 \
            --local_ram_resources=4096 \
            --verbose_failures
