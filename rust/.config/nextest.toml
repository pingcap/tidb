# Nextest's LEAK report means: the test's stdout/stderr pipe was still open
# `leak-timeout` after the test process exited. A pipe that NEVER closes is a
# real leak -- a spawned child or a helper thread outliving the test -- and it
# must stay red. A pipe that closes LATE is not, and the 100ms default calls
# 0-3 of `difftest`'s tests leaky on this workspace whenever ~24 test processes
# are spawned at once:
#
#   --test-threads=1          5 runs, 0 leaky
#   --test-threads=2          3 runs, 0 leaky
#   7 of the 24, full threads 5 runs, 0 leaky
#   all 24, full threads      6 runs, 8 leaky reports across 4 of them
#   all 24, leak-timeout 5s   4 runs, 0 leaky
#
# The leak follows the COMPLETION SLOT, not the test: the names rotate run to
# run over tests that do nothing but read files, and any one of them run alone
# 10 times is never leaky. No test here holds anything open -- the pipes just
# take longer than 100ms to close under a 24-way spawn.
#
# 2s is more than twice the longest test in this crate and costs nothing on a
# healthy run: nextest waits out this timeout only for a pipe that is STILL
# open at exit. A genuinely leaked child holds the pipe forever, so it is still
# reported, 2s later.
#
# This is a REPORTING threshold, not a suppression. If LEAK appears with this
# file in place, something really is outliving a test. Probed: a test that
# spawns `sleep 30` is reported LEAK 2s later, with this file in place. That
# probe also showed WHY the names rotate -- the one leaked child dragged THREE
# innocent siblings into the report with it, because a process spawned
# alongside them inherits their pipes. The report names the slot; it does not
# name the culprit.
[profile.default]
leak-timeout = "2s"

# A runaway test is killed and reported TIMEOUT instead of running unbounded.
# The longest healthy tests take ~2 min (adminpause, materialized view refresh,
# 2026-11-25 gate and workspace runs); 10 min is five times that. Without it
# difftest query_diff ran 70 min and grew to 25 GB in a workspace run.
slow-timeout = { period = "60s", terminate-after = 10 }

# Matches `.cargo/config.toml`'s `jobs = 12`: leaving four of the sixteen
# cores free keeps the machine responsive during a run, and the lighter spawn
# also reduces the pipe-close contention the note above measures.
test-threads = 12

# Start the long tests first. A gate's wall time is its slowest worker's queue;
# a 40-75s partition or DDL test picked up near the end of a ~7000-test run
# leaves eleven threads idle behind it. Measured from gate runs (2026-11-19).
[[profile.default.overrides]]
filter = 'test(/^executor_partition_table_test::/) | test(/partition_db_partition_ddl_source::/) | test(/serial_ddl_ingest_source::/) | test(/materialized_view::/) | test(/^executor_parallel_apply_test::/) | test(/^executor_test_aggregate_aggregate_test::/) | test(test_union2) | test(/^executor_join_test_mergejoin/)'
priority = 100

# Iteration and mutation runs (`--profile quick`): a hung test is killed after
# 90 s instead of the default's 10 min, so a deadlock or retry loop costs a
# minute and a half, not a gate's worth of time. Targeted tests take seconds.
[profile.quick]
slow-timeout = { period = "30s", terminate-after = 3 }

# The documented long tests (above) run ~2 min when healthy: adminpause runs
# 39 index cases at Go's 600 ms schema lease (134 s in the 2026-11-28 gate).
# The quick profile's 90 s cut would kill them on every run, so they keep the
# default profile's limit.
[[profile.quick.overrides]]
filter = 'test(/adminpause::/) | test(/materialized_view::/)'
slow-timeout = { period = "60s", terminate-after = 10 }
