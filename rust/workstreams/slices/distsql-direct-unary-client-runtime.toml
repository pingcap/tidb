ring = "result"
consumer = "Campaign 09 extends the bounded TiKV unary DAG read path with the pinned client-go address-keyed connection lifecycle and exact tikvpb.Tikv/Coprocessor gRPC method. The real client implements the existing KV-owned SendRequest-shaped capability, reuses channels per address, attaches the already selected request context exactly once, enforces the caller timeout, returns raw protobuf response bytes, and preserves typed address/version transport errors and close/reopen behavior. A live-TiKV probe may supply checked single-region topology, but this slice does not claim PD discovery, RegionCache freshness, retry, locks, TLS, batch/stream/async RPC, forwarding, compression, metrics, or COM_QUERY wiring."
test_target = "existing direct unary/read suites plus tikv_tonic_coprocessor_source and the ignored Campaign 09 RealTiKV unary proof"
