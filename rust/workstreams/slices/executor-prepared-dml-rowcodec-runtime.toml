support_anchors = [
  "PARTIAL TestPreparedInsert scope is repeated positional signed-BIGINT VALUES rows and exact persisted clustered rows only; INSERT SELECT, plan-cache counters, defaults, indexes, generated columns, and unsupported statement forms remain open",
  "PARTIAL TestPreparedUpdate scope is direct and checked-add signed-BIGINT point update with exact persisted rows only; general expressions, plan-cache counters, indexes, generated columns, and unsupported statement forms remain open",
  "This slice consumes tidb-codec through its evidence prerequisites and does not re-own the tablecodec/rowcodec test inventory. Those obligations stay with codec-table-key-range-runtime, codec-row-layout-wave, codec-rowcodec-decoder-wave, codec-rowcodec-encoder-wave, and txnkv-write-conflict-table-key-diagnostics, and the ones no slice has reached stay UNTRIAGED. A bounded signed-BIGINT row writer cannot discharge cut-row, cut-key, prefix, unflatten, typed column, NULL/default, or old-format obligations, so claiming them here would convert a broad source family from one narrow vertical",
  "Byte-exactness against Go is proved as evidence quality for the two prepared-DML obligations rather than as a new codec claim: difftests/transaction-tests/fixtures/generate_configured_rows.go emits real tablecodec/rowcodec bytes and rust/crates/tidb-codec/tests/configured_bigint_row_write_source.rs compares against them",
  "Never call or wrap tidb_exec::Database for this path; UPDATE snapshot Get and every mutation must use txnkv-real-optimistic-2pc-runtime against real TiKV",
  "txnkv-real-optimistic-2pc-runtime is named as an evidence prerequisite rather than a whole-slice dependency: normal optimistic 2PC is deliberately a bounded PARTIAL family (pessimistic locks, async commit, 1PC, pipelined DML, TTL/heartbeats, and most of its original test inventory remain open), so it can never reach the COVERED status depends_on requires. The named PARTIAL anchors are the exact capabilities this slice consumes — one concrete transaction that allocates a real PD start timestamp, reads its own snapshot at that timestamp, and rolls back every possibly-prewritten key on a definitive failure",
  "Stage C proves exact planner/rowcodec behavior and concrete composition with the real-tested transaction API; actual TCP plus PD/TiKV plus independent Go TiDB acceptance belongs to the dependent Stage D/E live slices and may not be replaced by a mock executor or storage trait",
]
