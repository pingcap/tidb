consumer = "The parsed handshake capability intersection selects zlib before zstd and preserves the negotiated zstd level; one generic command-I/O adapter then reads a sequence-zero command through PacketIoReader, routes it through tidb_server::Connection::dispatch_framed_auto, and writes and flushes the resulting sequence-one response through PacketIoWriter in the same negotiated compression mode. This direct packetio.go plus conn.go transition preserves existing uncompressed and compressed packet vectors and command dispatch behavior, and its conn.go ownership transfer must preserve every non-conn row in the prior multirow server evidence files. Live TcpStream ownership, TLS and authentication execution, socket deadlines, metrics, server error-stack conversion, backpressure, incremental result streaming, prepared statements and unsupported COM commands, connection shutdown and kill state, and the complete server lifecycle remain external, so implementation evidence must finish PARTIAL"
