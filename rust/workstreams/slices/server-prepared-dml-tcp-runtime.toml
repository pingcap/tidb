support_anchors = [
  "Continue C27's exact per-connection prepared registry, binary execute decoder, type-vector reuse, cancellation, real catalog, and shared real-TiKV read path; do not add a second listener, session registry, executor injection point, fake catalog, mock transaction, or text-query DML fallback",
  "Perform the steward-owned read-to-KV process-authority rename once in this slice: the one authority exposes read-session and transaction openers with the same authority_id and reuses its already-running PD, RegionCache, and TiKV transport handles; do not retain compatibility aliases or instantiate a transaction-only process authority",
  "Extend C27 metadata from one signed MYSQL_TYPE_LONGLONG result parameter to the frozen variable signed-BIGINT DML counts and zero result columns; NULL, unsigned, wrong counts/types, cursor, long data, reset, unsupported SQL, unknown/cross-connection/closed handles, and malformed packets fail before storage publication",
  "OkPacket affected_rows is emitted only after CommitOutcome::Committed with all happy-path secondaries confirmed, or for the exact no-mutation UPDATE result; CleanupFailed and Undetermined never emit OK, and Undetermined closes the connection without SQL retry",
  "The listed prepared-count tests are PARTIAL only for handle accounting, execute reuse, close isolation, and admitted DML; their broader SQL/protocol/session behavior remains open",
]
