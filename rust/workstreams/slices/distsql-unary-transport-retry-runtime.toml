status = "partial"
target = "tidb-distsql"
ring = "result"
consumer = "Campaign 12 replaces the direct-unary terminal transport-error boundary with a response-owned send-failure state machine. Peer selection happens immediately before dispatch; each immutable attempt carries its exact route and connection generation; cancellation, remote Canceled, generic timeout/connection, StoreNotMatch, liveness, shared-store invalidation, TiKVRPC backoff, peer probing, task rebuild, and successful leader promotion follow pinned client-go precedence. Failed attempts cannot advance paging/cache/EMA or reorder later logical tasks. Active in-flight cancellation, configurable short-read fast rotation, follower/stale reads, forwarding, locks, batch/stream/TiFlash, TLS, and production concurrency remain explicit gaps."
test_target = "cop_read_task_runtime_source, direct_unary_client_runtime_source, direct unary table/index reader source, and the owner-executed ignored Campaign 12 TiKV-stop proof"
