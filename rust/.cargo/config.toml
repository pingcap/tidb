[build]
jobs = 12
# The parallel compiler frontend: type-checking and borrow-checking a crate
# across threads, rather than one crate at a time on one core. Nightly-only,
# which is what `rust-toolchain.toml` pins the channel for; see that file for
# the measurements.
#
# 8, not 12: the frontend scales sublinearly and `jobs = 12` already runs 12
# crates at once, so a higher per-crate thread count mostly oversubscribes a
# machine that is often also running a TiUP cluster and a sysbench workload.
rustflags = ["-Zthreads=8"]

[env]
# The test harness runs each test on a thread with a 2 MiB default stack.
# The vendored `tikv-client-rs` mock's async lock-resolution future chain
# (`third_party/tikv-client-rs/src/transaction/lock.rs`, reached through the
# mock transaction commit path) overflows that in a debug build, so several
# `tidb-txnkv` integration tests abort with `has overflowed its stack`.
# 32 MiB is the size those tests need; it costs one thread's stack per test.
RUST_MIN_STACK = "33554432"
