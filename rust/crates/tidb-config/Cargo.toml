[package]
name = "tidb-config"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Transcreation of TiDB pkg/config leaf packages (configtypes, deploymode, kerneltype)"

autotests = false
build = "../../scripts/aggregate-tests.rs"

[features]
# Go build tag `nextgen`: selects the Next Generation kernel type.
nextgen = []

[dependencies]
base64 = { workspace = true }
serde = { workspace = true }
regex = { workspace = true }
rustix = { workspace = true }
tidb-naming = { path = "../tidb-naming" }
tidb-tikvutil = { path = "../tidb-tikvutil" }
serde_ignored = "0.1"
serde_json = { workspace = true }
toml = "0.8"

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
