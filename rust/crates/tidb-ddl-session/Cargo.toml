[package]
name = "tidb-ddl-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Go pkg/ddl/session transaction wrapper and resource-pool adapter."

[lints]
workspace = true

[features]
default = []
failpoints = ["dep:fail", "fail/failpoints"]

[dependencies]
fail = { version = "0.4", optional = true }
prometheus = { version = "0.14", default-features = false }
tidb-datatype = { path = "../tidb-datatype" }
tidb-sqlexec = { path = "../tidb-sqlexec" }
tidb-util = { path = "../tidb-util" }
tracing = "0.1"

[dev-dependencies]
tidb-ast = { path = "../tidb-ast" }
tidb-model = { path = "../tidb-model" }
tidb-resolve = { path = "../tidb-resolve" }
