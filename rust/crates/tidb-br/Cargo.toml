[package]
name = "tidb-br"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Go br/pkg/streamhelper/spans, br/pkg/rtree, br/pkg/restore/utils and br/pkg/summary: BR's interval maps, range trees, and restore rewrite rules."

[lints]
workspace = true

[dependencies]
tidb-config = { path = "../tidb-config" }
tidb-objstore = { path = "../tidb-objstore" }
tidb-objstore-s3like = { path = "../tidb-objstore-s3like" }
tidb-table-filter = { path = "../tidb-table-filter" }
tidb-tablecodec = { path = "../tidb-tablecodec" }
tidb-redact = { path = "../tidb-redact" }
tidb-goruntime = { path = "../tidb-goruntime" }
tidb-log = { path = "../tidb-log" }
tidb-codec = { path = "../tidb-codec" }
tidb-model = { path = "../tidb-model" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-proto = { path = "../tidb-proto" }
tidb-terror = { path = "../tidb-terror" }
tidb-go-semver = { path = "../tidb-go-semver" }
tonic.workspace = true
base64.workspace = true
tokio.workspace = true
crossbeam-channel = "0.5"
regex.workspace = true
serde.workspace = true
uuid = { version = "1", features = ["v4"] }
reqwest = { workspace = true, features = ["blocking"] }
tikv-client.workspace = true
tidb-txnkv = { path = "../tidb-txnkv" }
tidb-distsql = { path = "../tidb-distsql" }
tidb-ranger = { path = "../tidb-ranger" }
tidb-meta = { path = "../tidb-meta" }
tidb-structure = { path = "../tidb-structure" }
tidb-ddl-label = { path = "../tidb-ddl-label" }
tidb-cdcutil = { path = "../tidb-cdcutil" }
tidb-config-kerneltype = { path = "../tidb-config-kerneltype" }
tidb-domain-serverinfo = { path = "../tidb-domain-serverinfo" }
tidb-metadef = { path = "../tidb-metadef" }
tidb-ast = { path = "../tidb-ast" }
tidb-go-time-layout = { path = "../tidb-go-time-layout" }
tidb-lightning-common = { path = "../tidb-lightning-common" }
tidb-pd-client = { path = "../tidb-pd-client" }
tidb-mysql = { path = "../tidb-mysql" }
tidb-versioninfo = { path = "../tidb-versioninfo" }
tidb-sqlescape = { path = "../tidb-sqlescape" }
tidb-errno = { path = "../tidb-errno" }
tidb-go-url = { path = "../tidb-go-url" }
tidb-go-strconv = { path = "../tidb-go-strconv" }
tidb-config-configtypes = { path = "../tidb-config-configtypes" }

tidb-gocontext = { path = "../tidb-gocontext" }
tidb-encrypt = { path = "../tidb-encrypt" }
prost.workspace = true
sha2.workspace = true
serde_json.workspace = true
chrono.workspace = true
hex = "0.4"
getrandom.workspace = true
tidb-failpoint = { path = "../tidb-failpoint" }
tidb-stats-util = { path = "../tidb-stats-util" }

[dev-dependencies]
tidb-failpoint = { path = "../tidb-failpoint", features = ["failpoints"] }
async-trait.workspace = true
tempfile.workspace = true
