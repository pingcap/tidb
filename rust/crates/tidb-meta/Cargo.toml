[package]
name = "tidb-meta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB meta: the KV key/value codec for the catalog stored under the `m` namespace."

autotests = false

[features]
default = []
nextgen = ["tidb-config/nextgen"]

[lints]
workspace = true

[dependencies]
tidb-dbterror = { path = "../tidb-dbterror" }
tidb-tablecodec = { path = "../tidb-tablecodec" }
tidb-structure = { path = "../tidb-structure" }
tidb-kv = { path = "../tidb-kv" }
tidb-errno = { path = "../tidb-errno" }
tidb-terror = { path = "../tidb-terror" }
tidb-config-kerneltype = { path = "../tidb-config-kerneltype" }
tidb-partialjson = { path = "../tidb-partialjson" }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
chrono.workspace = true
tidb-ast = { path = "../tidb-ast" }
tidb-codec = { path = "../tidb-codec" }
tidb-config = { path = "../tidb-config" }
tidb-dxf = { path = "../tidb-dxf" }
tidb-metadef = { path = "../tidb-metadef" }
tidb-model = { path = "../tidb-model" }
tidb-mysql = { path = "../tidb-mysql" }

[dev-dependencies]
sha2.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
