[package]
name = "tidb-error"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Every Go package's error prototypes, pending their move to their packages' crates (not a Go package)."

autotests = false

[dependencies]
tidb-errno = { path = "../tidb-errno" }
tidb-terror = { path = "../tidb-terror" }
tidb-mysql = { path = "../tidb-mysql" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tracing = "0.1"

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

[dev-dependencies]
tidb-errctx = { path = "../tidb-errctx" }
tidb-server-err = { path = "../tidb-server-err" }
