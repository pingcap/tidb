[package]
name = "tidb-metering-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Go metering_sdk configuration, providers and metering writer used by TiDB DXF."

[lints]
workspace = true

[dependencies]
reqsign = { version = "0.16.5", default-features = false, features = ["services-azblob"] }
tidb-azure-sdk = { path = "../tidb-azure-sdk" }
tidb-aws-sdk = { path = "../tidb-aws-sdk" }
tidb-oss-sdk = { path = "../tidb-oss-sdk" }
reqwest12 = { package = "reqwest", version = "0.12.24", default-features = false, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
url = "2"
percent-encoding = "2"
opendal = { version = "=0.55.0", features = ["services-s3", "services-oss", "services-azblob"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }
tidb-gocontext = { path = "../tidb-gocontext" }
tidb-ast = { path = "../tidb-ast" }
tidb-stringutil = { path = "../tidb-stringutil" }

[dev-dependencies]
tempfile.workspace = true
