[package]
name = "tidb-pd-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB's etcd client over PD, the shared cluster TLS settings and PD HTTP store records."

autotests = false

[lints]
workspace = true

[dependencies]
tidb-logutil = { path = "../tidb-logutil" }
etcd-client.workspace = true
rustls.workspace = true
tidb-log = { path = "../tidb-log" }
tidb-proto = { path = "../tidb-proto" }
tikv-client.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true

[dev-dependencies]
tonic-prost.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
tokio-stream = { workspace = true, features = ["net"] }

[[test]]
name = "all"
path = "tests/all.rs"
