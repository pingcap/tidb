[package]
name = "tidb-sessionstates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB sessionctx/sessionstates: the session state a migration carries (Rust rewrite)."

[dependencies]
tidb-dbterror = { path = "../tidb-dbterror" }
tidb-errno = { path = "../tidb-errno" }
tidb-terror = { path = "../tidb-terror" }
tidb-config-deploymode = { path = "../tidb-config-deploymode" }
tidb-context = { path = "../tidb-context" }
tidb-stringutil = { path = "../tidb-stringutil" }
base64 = { workspace = true }
chrono = { workspace = true }
tidb-failpoint = { path = "../tidb-failpoint", optional = true }
openssl = "0.10.81"
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tidb-datatype = { path = "../tidb-datatype" }
tidb-log = { path = "../tidb-log" }
tidb-model = { path = "../tidb-model" }
tidb-mysql = { path = "../tidb-mysql" }
x509-parser = { version = "=0.18.1", default-features = false }

[dev-dependencies]
tidb-failpoint = { path = "../tidb-failpoint", features = ["failpoints"] }
tempfile = { workspace = true }
# The package's own failpoints, on in its test build.
tidb-sessionstates = { path = ".", features = ["failpoints"] }

[features]
# Go's failpoints (tidb-failpoint), compiled in for tests.
failpoints = ["dep:tidb-failpoint", "tidb-failpoint/failpoints"]

[lints]
workspace = true
