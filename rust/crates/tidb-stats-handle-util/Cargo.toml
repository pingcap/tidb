[package]
name = "tidb-stats-handle-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB statistics handle utility package."

[lints]
workspace = true

[features]
failpoints = ["dep:tidb-failpoint", "tidb-failpoint/failpoints", "tidb-build-tags/failpoints"]
intest = ["tidb-build-tags/intest"]

[dependencies]
tidb-build-tags = { path = "../tidb-build-tags" }
tidb-intest = { path = "../tidb-intest" }
tidb-sqlescape = { path = "../tidb-sqlescape" }
tidb-goruntime = { path = "../tidb-goruntime" }
tidb-failpoint = { path = "../tidb-failpoint", optional = true }
tidb-hack = { path = "../tidb-hack" }
tidb-ast = { path = "../tidb-ast" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-model = { path = "../tidb-model" }
tidb-resolve = { path = "../tidb-resolve" }
tidb-sqlexec = { path = "../tidb-sqlexec" }
tidb-sqlexec-mock = { path = "../tidb-sqlexec-mock" }
tidb-syssession = { path = "../tidb-syssession" }
tidb-vardef = { path = "../tidb-vardef" }
tikv-client.workspace = true
