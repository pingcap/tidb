[package]
name = "tidb-gcworker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Go pkg/store/gcworker: the GC leader that advances safe points, resolves locks and destroys delete ranges."

[lints]
workspace = true

[dependencies]
tidb-unistore-tikv = { path = "../tidb-unistore-tikv" }
tidb-config-configtypes = { path = "../tidb-config-configtypes" }
tidb-config-deploymode = { path = "../tidb-config-deploymode" }
tidb-config-kerneltype = { path = "../tidb-config-kerneltype" }
tidb-domain-infosync = { path = "../tidb-domain-infosync" }
tidb-store-driver-error = { path = "../tidb-store-driver-error" }
tidb-dbterror = { path = "../tidb-dbterror" }
tidb-go-time-layout = { path = "../tidb-go-time-layout" }
tidb-intest = { path = "../tidb-intest" }
tidb-logutil = { path = "../tidb-logutil" }
tidb-monotime = { path = "../tidb-monotime" }
tidb-sem = { path = "../tidb-sem" }
tidb-sqlescape = { path = "../tidb-sqlescape" }
tidb-domain-core = { path = "../tidb-domain-core" }
tidb-metrics = { path = "../tidb-metrics" }
tidb-mysql = { path = "../tidb-mysql" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-session = { path = "../tidb-session" }
tidb-ddl = { path = "../tidb-ddl" }
tidb-ddl-label = { path = "../tidb-ddl-label" }
chrono.workspace = true
serde_json = { workspace = true }
tikv-client.workspace = true
tokio.workspace = true
async-trait.workspace = true
tidb-codec = { path = "../tidb-codec" }
tidb-config = { path = "../tidb-config" }
tidb-log = { path = "../tidb-log" }
tidb-model = { path = "../tidb-model" }
tidb-placement = { path = "../tidb-placement" }
tidb-variable = { path = "../tidb-variable" }
tidb-txnkv = { path = "../tidb-txnkv" }

[dev-dependencies]
fail = { version = "0.4", features = ["failpoints"] }
# Go's `tikvclient/...` failpoints, which the GC tests enable.
tikv-client = { workspace = true, features = ["failpoints"] }
tidb-unistore = { path = "../tidb-unistore" }
