[package]
name = "tidb-unistore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB pkg/store/mockstore/unistore: the in-process TiKV and PD (Rust)."

[lints]
workspace = true

[dependencies]
tidb-unistore-tikv = { path = "../tidb-unistore-tikv" }
tidb-unistore-cophandler = { path = "../tidb-unistore-cophandler" }
tidb-unistore-kverrors = { path = "../tidb-unistore-kverrors" }
tidb-unistore-lockstore = { path = "../tidb-unistore-lockstore" }
regex = { workspace = true }
chrono.workspace = true
chrono-tz.workspace = true
# `tikv.go`'s value encodings are built from `pkg/util/codec`'s primitives.
tidb-codec = { path = "../tidb-codec" }
# `Lock.ToLockInfo` answers the real `kvrpcpb.LockInfo`.
tidb-proto = { path = "../tidb-proto" }
prost.workspace = true
tidb-tablecodec = { path = "../tidb-tablecodec" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-txnkv = { path = "../tidb-txnkv" }
# Go's unistore implements client-go's `tikv.Client` and `pd.Client`; this
# crate implements client-rust's.
tikv-client.workspace = true
tokio.workspace = true
async-trait.workspace = true

[dev-dependencies]
tidb-store-driver-txn = { path = "../tidb-store-driver-txn" }
tidb-domain = { path = "../tidb-domain" }
flate2.workspace = true
