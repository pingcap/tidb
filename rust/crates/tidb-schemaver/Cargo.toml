[package]
name = "tidb-schemaver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Go pkg/ddl/schemaver: the etcd and in-memory schema-version syncers between a DDL owner and its followers."

[lints]
workspace = true

[features]
nextgen = ["tidb-config/nextgen"]

[dependencies]
tidb-config-kerneltype = { path = "../tidb-config-kerneltype" }
tidb-domain-serverinfo = { path = "../tidb-domain-serverinfo" }
tidb-logutil = { path = "../tidb-logutil" }
# `EtcdOps` is this tier's etcd seam; `ServerInfo`/`join_host_port` stand in
# for Go's `infosync`/`disttaskutil` imports of the MDL wait path.
tidb-config = { path = "../tidb-config" }
# Go `variable.EnableMDL`.
tidb-vardef = { path = "../tidb-vardef" }
# Go `logutil.BgLogger`/`DDLLogger` and `strconv.Quote` for the log lines.
tidb-ddl-logutil = { path = "../tidb-ddl-logutil" }
tidb-hack = { path = "../tidb-hack" }
tidb-log = { path = "../tidb-log" }
