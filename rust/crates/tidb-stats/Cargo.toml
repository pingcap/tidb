[package]
name = "tidb-stats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Source-backed statistics primitives for the TiDB Rust rewrite."
autotests = false

[lints]
workspace = true

[dependencies]
tidb-dbterror = { path = "../tidb-dbterror" }
tidb-charset = { path = "../tidb-charset" }
tidb-errno = { path = "../tidb-errno" }
tidb-terror = { path = "../tidb-terror" }
tidb-mysql = { path = "../tidb-mysql" }
tidb-fastrand = { path = "../tidb-fastrand" }
tidb-generic = { path = "../tidb-generic" }
tidb-mathutil = { path = "../tidb-mathutil" }
tidb-memory = { path = "../tidb-memory" }
tidb-sqlkiller = { path = "../tidb-sqlkiller" }
tidb-goruntime = { path = "../tidb-goruntime" }
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
tidb-chunk = { path = "../tidb-chunk" }
tidb-codec = { path = "../tidb-codec" }
tidb-tablecodec = { path = "../tidb-tablecodec" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-model = { path = "../tidb-model" }
tidb-txnkv = { path = "../tidb-txnkv" }
tidb-vardef = { path = "../tidb-vardef" }

[dev-dependencies]
tidb-stats-handle-globalstats = { path = "../tidb-stats-handle-globalstats" }
