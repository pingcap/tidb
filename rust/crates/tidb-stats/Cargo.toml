[package]
name = "tidb-stats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Source-backed statistics primitives for the TiDB Rust rewrite."
autotests = false
build = "../../scripts/aggregate-tests.rs"

[lints]
workspace = true

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
tidb-codec = { path = "../tidb-codec" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-error = { path = "../tidb-error" }
tidb-model = { path = "../tidb-model" }
tidb-txnkv = { path = "../tidb-txnkv" }
tidb-util = { path = "../tidb-util" }
tidb-vardef = { path = "../tidb-vardef" }
tidb-stats-handle-util = { path = "../tidb-stats-handle-util" }

[dev-dependencies]
serde_json.workspace = true
sha2 = { workspace = true }

[[test]]
name = "all"
path = "tests/all.rs"

[[bench]]
name = "global_stats"
harness = false
