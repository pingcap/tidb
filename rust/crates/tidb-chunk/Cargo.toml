[package]
name = "tidb-chunk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB util/chunk: the columnar row container for execution (Rust rewrite)."

autotests = false
build = "../../scripts/aggregate-tests.rs"

[dependencies]
tidb-datatype = { path = "../tidb-datatype" }
tidb-util = { path = "../tidb-util" }
tracing = "0.1"

[dev-dependencies]
tidb-util = { path = "../tidb-util", features = ["testexport"] }

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
