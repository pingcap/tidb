test = { cwd = "rust", argv = ["cargo", "test", "--offline", "--locked", "-j12", "-p", "tidb-chunk", "--test", "codec_contract", "type_width_table_matches_the_accepted_owner", "--", "--exact", "--nocapture"] }
mutation = { path = "rust/crates/tidb-chunk/src/codec.rs", old = "return fixed;", new = "return fixed + 1;", count = 1 }

