exclude_categories = ["benchmark"]
boundary_cases = ["1024-row input", "fixed and variable columns", "encode byte count", "decode row count"]
rust_files = ["rust/crates/tidb-chunk/src/codec.rs", "rust/crates/tidb-chunk/tests/codec_contract.rs"]
test = { cwd = "rust", argv = ["cargo", "test", "--offline", "--locked", "-j12", "-p", "tidb-chunk", "--test", "codec_contract", "benchmark_workloads_keep_codec_semantics_live", "--", "--exact", "--nocapture"] }
mutation = { path = "rust/crates/tidb-chunk/src/codec.rs", old = "buffer.extend_from_slice(data.as_ref());", new = "let _ = data;", count = 1 }

[[rules]]
id = "R_CHUNK_CODEC_RUNTIME_ADAPTATION"
status = "DECLINED"
rationale = "Rust uses safe typed storage instead of Go unsafe slice reinterpretation and static bitmap initialization; emitted offset and bitmap bytes remain covered by the wire-image rule."
sources = ["pkg/util/chunk/codec.go"]
owners = ["bytesToI64Slice", "i64SliceToBytes", "init", "var:allNotNullBitmap:0"]
exclude_anchors = ["init/loop:1/zero_iterations"]

[[rules]]
id = "R_CHUNK_CODEC_BENCHMARK_DRIVER"
status = "DECLINED"
rationale = "Go testing.B entrypoints and b.N driver loops measure the preserved workload but are not observable TiDB package behavior."
sources = ["pkg/util/chunk/codec_test.go"]
owners = ["Benchmark*"]
categories = ["benchmark"]

[[rules]]
id = "R_CHUNK_CODEC_BENCHMARK_ITERATION"
status = "DECLINED"
rationale = "The b.N timing loop is owned by the Go benchmark driver; deterministic setup and result-producing work remain covered."
sources = ["pkg/util/chunk/codec_test.go"]
owners = ["Benchmark*"]
anchors = ["Benchmark*/loop:2/enters"]

[[rules]]
id = "R_CHUNK_CODEC_FIXED_ZERO_PATHS"
status = "UNREACHABLE"
rationale = "Literal positive initialization and test bounds, plus testing.B positive iteration counts, make these zero-iteration companion paths unreachable."
sources = ["pkg/util/chunk/codec.go", "pkg/util/chunk/codec_test.go"]
owners = ["init", "TestCodec", "Benchmark*"]
anchors = ["*/zero_iterations"]
