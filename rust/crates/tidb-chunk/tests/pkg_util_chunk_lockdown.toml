[[rules]]
id = "R_CHUNK_CODEC_WIRE_IMAGE"
status = "PORTED"
rationale = "Chunk codec encode and decode preserve the accepted wire image, column shapes, nulls, offsets, checked framing, and legal suffix."
sources = ["pkg/util/chunk/codec.go", "pkg/util/chunk/codec_test.go"]
owners = ["Codec.*", "NewCodec", "type:Codec", "TestCodec"]
exclude_anchors = ["TestCodec/loop:*/zero_iterations"]
boundary_cases = ["accepted Go fixture", "fixed and variable columns", "null bitmap", "offsets", "existing target", "legal suffix", "malformed framing"]
rust_files = ["rust/crates/tidb-chunk/src/codec.rs", "rust/crates/tidb-chunk/tests/codec_contract.rs"]
test = { cwd = "rust", argv = ["cargo", "test", "--offline", "--locked", "-j12", "-p", "tidb-chunk", "--test", "codec_contract", "wire_image_matches_go_and_checked_decode_preserves_suffix", "--", "--exact", "--nocapture"] }
mutation = { path = "rust/crates/tidb-chunk/src/codec.rs", old = "if null_count > length {", new = "if null_count >= length {", count = 1 }

[[rules]]
id = "R_CHUNK_CODEC_DECODER_BATCHING"
status = "PORTED"
rationale = "Incremental decoding rounds bitmap batches, preserves fixed and variable values, tracks remaining rows, and reuses the final owner with rebased offsets."
sources = ["pkg/util/chunk/codec.go"]
owners = ["Decoder.*", "NewDecoder", "type:Decoder"]
boundary_cases = ["unaligned destination", "eight-row bitmap rounding", "remaining rows", "offset rebasing"]
rust_files = ["rust/crates/tidb-chunk/src/codec.rs", "rust/crates/tidb-chunk/tests/codec_contract.rs"]
test = { cwd = "rust", argv = ["cargo", "test", "--offline", "--locked", "-j12", "-p", "tidb-chunk", "--test", "codec_contract", "decoder_batches_and_reuses_remaining_rows", "--", "--exact", "--nocapture"] }
mutation = { path = "rust/crates/tidb-chunk/src/codec.rs", old = "let rows = deficit\n            .div_ceil(8)\n            .saturating_mul(8)\n            .min(self.remained_rows);", new = "let rows = deficit.min(self.remained_rows);", count = 1 }

[[rules]]
id = "R_CHUNK_CODEC_TYPE_WIDTH"
status = "PORTED"
rationale = "Type-width helpers preserve fixed layouts and accepted variable estimates without collapsing Date and NewDate."
sources = ["pkg/util/chunk/codec.go", "pkg/util/chunk/codec_test.go"]
owners = ["EstimateTypeWidth", "GetFixedLen", "getFixedLen", "const:VarElemLen:0", "TestEstimateTypeWidth"]
boundary_cases = ["fixed-width types", "variable default", "declared length thresholds", "Date versus NewDate"]
