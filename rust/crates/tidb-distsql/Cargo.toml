[package]
name = "tidb-distsql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Source-shaped read-only DistSQL request context primitives for the TiDB Rust rewrite."
autotests = false
build = "../../scripts/aggregate-tests.rs"

# The context is integrated once its session consumer exists; request routing
# and RPC remain separate capabilities with their own future crates.

[dependencies]
prost.workspace = true
tidb-codec = { path = "../tidb-codec" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-proto = { path = "../tidb-proto" }
tidb-txnkv = { path = "../tidb-txnkv" }

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
