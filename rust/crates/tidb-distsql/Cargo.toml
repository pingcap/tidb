[package]
name = "tidb-distsql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Source-shaped read-only DistSQL request context primitives for the TiDB Rust rewrite."
autotests = false

# The context is integrated once its session consumer exists; request routing
# and RPC remain separate capabilities with their own future crates.

[dependencies]
tidb-metrics = { path = "../tidb-metrics" }
tidb-expr = { path = "../tidb-expr" }
tidb-kv = { path = "../tidb-kv" }
tidb-vardef = { path = "../tidb-vardef" }
tidb-ristretto = { path = "../tidb-ristretto" }
prost.workspace = true
tidb-chunk = { path = "../tidb-chunk" }
tidb-codec = { path = "../tidb-codec" }
tidb-config = { path = "../tidb-config" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-proto = { path = "../tidb-proto" }
tidb-error = { path = "../tidb-error" }
tidb-mysql = { path = "../tidb-mysql" }
tidb-txnkv = { path = "../tidb-txnkv" }
tidb-util = { path = "../tidb-util" }
tikv-client.workspace = true
tokio.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true

[dev-dependencies]
