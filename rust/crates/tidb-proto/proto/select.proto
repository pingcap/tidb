// Source: github.com/pingcap/tipb@v0.0.0-20260623093813-5f9928e91afe/proto/select.proto
// ScalarFuncSig is copied in full from the same pin's proto/expression.proto;
// checked by rust/scripts/sync-tipb-scalar-func-sig.py.
//
// This is a source-owned, dependency-closed projection of the request and
// response messages used by TiDB's bounded TiKV scan and distsql SelectResult
// paths. Field names, numbers, scalar types, repeated/optional cardinality, and
// enum values are copied from the upstream proto. Generator-only
// gogoproto/rustproto options and unsupported executor messages are omitted.
syntax = "proto2";

package tipb;

// The executor kinds admitted by the bounded TiKV scan and Selection lowering
// path. Numeric values are copied from executor.proto.
enum ExecType {
  TypeTableScan = 0;
  TypeIndexScan = 1;
  TypeSelection = 2;
  // Upstream's hash aggregation; the name predates TiKV's stream support.
  TypeAggregation = 3;
  TypeTopN = 4;
  TypeLimit = 5;
  TypeStreamAgg = 6;
  // Upstream tipb executor.proto:32.
  TypeExchangeSender = 9;
}

enum EngineType {
  Local = 0;
  TiKV = 1;
  TiFlash = 2;
}

// Dependency-closed projection of schema.proto ColumnInfo. The scalar fields
// marked nullable=false upstream remain optional here so callers can preserve
// their required wire presence with Some, including zero values.
message ColumnInfo {
  optional int64 column_id = 1;
  optional int32 tp = 2;
  optional int32 collation = 3;
  optional int32 columnLen = 4;
  optional int32 decimal = 5;
  optional int32 flag = 6;
  repeated string elems = 7;
  optional bytes default_val = 8;
  optional bool pk_handle = 21;
  optional bool array = 22;
}

message TableScan {
  optional int64 table_id = 1;
  repeated ColumnInfo columns = 2;
  optional bool desc = 3;
  repeated int64 primary_column_ids = 4;
  optional EngineType next_read_engine = 5;
  repeated int64 primary_prefix_column_ids = 7;
  optional bool keep_order = 8;
  optional bool is_fast_scan = 9;
  optional int32 max_wait_time_ms = 12;
}

message IndexScan {
  optional int64 table_id = 1;
  optional int64 index_id = 2;
  repeated ColumnInfo columns = 3;
  optional bool desc = 4;
  optional bool unique = 5;
  repeated int64 primary_column_ids = 6;
}

// Dependency-closed projection of expression.proto FieldType. The upstream
// nullable=false options are represented as optional proto2 fields here so
// callers can preserve their required wire presence, including zero values.
message FieldType {
  optional int32 tp = 1;
  optional uint32 flag = 2;
  optional int32 flen = 3;
  optional int32 decimal = 4;
  optional int32 collate = 5;
  optional string charset = 6;
  repeated string elems = 7;
  optional bool array = 8;
}

// The scalar expression kinds admitted by the coprocessor expression path.
// Values are copied from expression.proto; keeping the concrete literal
// families here lets Rust carry the same metadata as Go's ExprToPB.
enum ExprType {
  Null = 0;
  Int64 = 1;
  Uint64 = 2;
  Float32 = 3;
  Float64 = 4;
  // Go `constantToPBExpr`'s `KindString`/`KindBinaryLiteral` arm: the raw
  // bytes as `Val`, with no codec around them.
  String = 5;
  // Additional scalar leaves used by the upstream DAG converter.  Keeping
  // the exact tipb numbers here lets the Rust pushdown path carry the same
  // concrete values instead of falling back to a root Selection.
  Bytes = 6;
  MysqlBit = 101;
  MysqlDecimal = 102;
  MysqlDuration = 103;
  MysqlEnum = 104;
  MysqlSet = 106;
  MysqlTime = 107;
  MysqlJson = 108;
  TiDBVectorFloat32 = 121;
  ColumnRef = 201;
  // The aggregate-function family a partial TiKV aggregation carries. Only
  // the kinds the pushed-aggregate lowering builds are projected; upstream
  // also numbers Avg (3003), First (3006) and GroupConcat (3007).
  Count = 3001;
  Sum = 3002;
  // Go tipb `ExprType_MaxCount` / `ExprType_MinCount`: the aggregate
  // partials that retain an extreme value and its tie count.
  MinCount = 3022;
  MaxCount = 3023;
  Min = 3004;
  Max = 3005;
  ScalarFunc = 10000;
}

