// Dependency-closed projection of expression.proto Expr. RPN and order-by
// fields are intentionally outside this bounded scalar/aggregate path. The
// omitted aggFuncMode defaults to Partial1Mode in TiDB's PB decoder.
message Expr {
  optional ExprType tp = 1;
  optional bytes val = 2;
  repeated Expr children = 3;
  optional ScalarFuncSig sig = 4;
  optional FieldType field_type = 5;
  optional bool has_distinct = 7;
}

// TiKV's list-based Selection carries no child: its input is the preceding
// executor in DAGRequest.executors. RPN and TiFlash's tree child are external.
message Selection {
  repeated Expr conditions = 1;
}

// TiKV's list-based partial aggregation. Aggregate functions precede group-by
// expressions in the result schema for both global and grouped HashAgg.
message Aggregation {
  repeated Expr group_by = 1;
  repeated Expr agg_func = 2;
  optional bool streamed = 3;
}

// One order expression and its direction. RPN is outside this bounded path;
// field 3 is therefore omitted while the upstream field numbers remain.
message ByItem {
  optional Expr expr = 1;
  optional bool desc = 2;
}

// TiKV's list-based bounded sort. The tree child and window partitioning are
// outside this projection; the scan/Selection precede it in the DAG list.
message TopN {
  repeated ByItem order_by = 1;
  optional uint64 limit = 2;
}

// The coprocessor-side row cap. The upstream message also carries a child
// executor and a partition_by list for the tree-based TiFlash form; neither
// has a place in the TiKV list form this projection covers.
message Limit {
  optional uint64 limit = 1;
  // TiDB master PhysicalLimit.ToPB sends the already-truncated index column.
  // tipb fed7bc47c39d proto/executor.proto uses field 4 for these expressions.
  repeated Expr truncate_key_expr = 4;
}

message Executor {
  optional ExecType tp = 1;
  optional TableScan tbl_scan = 2;
  optional IndexScan idx_scan = 3;
  optional Selection selection = 4;
  optional Aggregation aggregation = 5;
  optional TopN topN = 6;
  optional Limit limit = 7;
  optional string executor_id = 10;
  // Upstream tipb executor.proto:59. The tree form is what TiFlash DAG
  // dispatch consumes (DAGRequest.root_executor).
  optional ExchangeSender exchange_sender = 12;
  optional uint32 parent_idx = 25;
}

// Upstream tipb executor.proto:77.
enum ExchangeType {
  PassThrough = 0;
  Broadcast = 1;
  Hash = 2;
}

// Upstream tipb executor.proto:91. This projection carries the fields the
// single-fragment root sender sets (tp, encoded_task_meta, child); partition
// keys, compression, and CTE/zone fields stay out until the corresponding
// planner tiers exist.
message ExchangeSender {
  optional ExchangeType tp = 1;
  // The sender task's own TaskMeta (upstream repeated bytes; Go sets one
  // entry for a root fragment: the coordinator-side receiver, task_id -1).
  repeated bytes encoded_task_meta = 2;
  optional Executor child = 4;
  // Upstream tipb executor.proto:97: the fragment's output field types.
  repeated FieldType all_field_types = 6;
}

// TiKV list-based DAG request fields owned by ConstructDAGReq. TiFlash's
// tree-based root_executor and unrelated request settings are intentionally
// absent from this bounded projection.
message DAGRequest {
  repeated Executor executors = 2;
  optional int64 time_zone_offset = 3;
  optional uint64 flags = 4;
  repeated uint32 output_offsets = 5;
  optional EncodeType encode_type = 8;
  optional string time_zone_name = 11;
  optional bool collect_execution_summaries = 12;
  optional ChunkMemoryLayout chunk_memory_layout = 14;
  optional uint32 div_precision_increment = 19;
  // Upstream tipb select.proto: the tree-form executor tree, currently only
  // consumed by TiFlash. When set, the list-form `executors` is ignored.
  optional Executor root_executor = 17;
}

message ChunkMemoryLayout {
  optional Endian endian = 1;
}

enum Endian {
  LittleEndian = 0;
  BigEndian = 1;
}

// Values are all in text format in the legacy row encoding.
message Row {
  optional bytes handle = 1;
  optional bytes data = 2;
}

message Error {
  optional int32 code = 1;
  optional string msg = 2;
}

// It is the data of an intermediate output channel.
message IntermediateOutput {
  optional EncodeType encode_type = 1;
  repeated Chunk chunks = 2;
}

// Response for SelectRequest.
message SelectResponse {
  optional Error error = 1;
  // Result rows.
  repeated Row rows = 2;
  // Use multiple chunks to reduce memory allocation and avoid allocating large
  // contiguous memory.
  repeated Chunk chunks = 3;
  repeated Error warnings = 4;
  repeated int64 output_counts = 5;
  optional int64 warning_count = 6;
  // The execution summary of each executor, in the order in request.
  repeated ExecutorExecutionSummary execution_summaries = 8;
  // It indicates the encode type of response.
  optional EncodeType encode_type = 9;
  // ndvs collects the number of distinct value information per range.
  repeated int64 ndvs = 10;
  // It contains all the intermediate outputs.
  repeated IntermediateOutput intermediate_outputs = 11;
}

// Chunk contains multiple rows data and rows meta.
message Chunk {
  // Data for all rows in the chunk.
  optional bytes rows_data = 3;
  // Meta data for every row.
  repeated RowMeta rows_meta = 4;
}

// RowMeta contains row handle and length of a row.
message RowMeta {
  optional int64 handle = 1;
  optional int64 length = 2;
}

enum EncodeType {
  TypeDefault = 0;
  TypeChunk = 1;
  // TypeCHBlock is used by TiSpark and TiFlash.
  TypeCHBlock = 2;
}

// StreamResponse is the streamed coprocessor response contract.
message StreamResponse {
  optional Error error = 1;
  // Data for all rows.
  optional bytes data = 3;
  repeated Error warnings = 4;
  // Output row count for each executor.
  repeated int64 output_counts = 5;
  optional int64 warning_count = 6;
  repeated int64 ndvs = 7;
}

// ExecutorExecutionSummary is the exact summary dependency referenced by
// SelectResponse.execution_summaries.  The nested TiFlash messages are kept
// here so field 6/8/9 decode with the same wire types as upstream.
message ExecutorExecutionSummary {
  optional uint64 time_processed_ns = 1;
  optional uint64 num_produced_rows = 2;
  optional uint64 num_iterations = 3;
  optional string executor_id = 4;
  optional uint64 concurrency = 5;

  oneof DetailInfo {
    TiFlashScanContext tiflash_scan_context = 6;
    ColumnarScanContext columnar_scan_context = 10;
  }

  optional bytes ru_consumption = 7;
  optional TiFlashWaitSummary tiflash_wait_summary = 8;
  optional TiFlashNetWorkSummary tiflash_network_summary = 9;
}

message TiFlashRegionNumOfInstance {
  optional string instance_id = 1;
  optional uint64 region_num = 2;
}

