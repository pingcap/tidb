syntax = "proto3";
package mpp;

import "metapb.proto";
import "coprocessor.proto";

// Wire-compatible dependency-closed projection of kvproto mpp.proto.
message TaskMeta {
  uint64 start_ts = 1;
  int64 task_id = 2;
  int64 partition_id = 3;
  string address = 4;
  uint64 gather_id = 5;
  uint64 query_ts = 6;
  uint64 local_query_id = 7;
  uint64 server_id = 8;
  int64 mpp_version = 9;
  uint32 keyspace_id = 10;
  string coordinator_address = 11;
  bool report_execution_summary = 12;
  int32 api_version = 16;
  string resource_group_name = 17;
  uint64 connection_id = 18;
  string connection_alias = 19;
  string sql_digest = 20;
  string plan_digest = 21;
}

message Error {
  int32 code = 1;
  string msg = 2;
  int64 mpp_version = 3;
}

message DispatchTaskResponse {
  Error error = 1;
  repeated metapb.Region retry_regions = 2;
}

message ReportTaskStatusRequest {
  TaskMeta meta = 1;
  bytes data = 2;
  Error error = 3;
}

message ReportTaskStatusResponse {
  Error error = 1;
}

// Upstream kvproto mpp.proto:54. `table_regions` (6) and
// `table_shard_infos` (7) stay out of this bounded projection until the
// partition-table and TiCI/FTS dispatch paths exist; regions keep their
// exact upstream field numbers and wire shape.
message DispatchTaskRequest {
  TaskMeta meta = 1;
  bytes encoded_plan = 2;
  int64 timeout = 3;
  repeated coprocessor.RegionInfo regions = 4;
  int64 schema_ver = 5;
}

// Upstream kvproto mpp.proto:74.
message CancelTaskRequest {
  TaskMeta meta = 1;
  Error error = 2;
}

message CancelTaskResponse {
  Error error = 1;
}

// Upstream kvproto mpp.proto:96: build connection between different tasks.
// Data is sent by the tasks that are closer to the data sources.
message EstablishMPPConnectionRequest {
  TaskMeta sender_meta = 1;
  TaskMeta receiver_meta = 2;
}

// Upstream kvproto mpp.proto:103. When TiFlash sends data to TiDB the data
// blocks wrap tipb.SelectResponse; `version` selects the data-packet
// format (string serdes version for MppVersionV2+ stores).
message MPPDataPacket {
  bytes data = 1;
  Error error = 2;
  repeated bytes chunks = 3;
  repeated uint64 stream_ids = 4;
  int64 version = 5;
}
