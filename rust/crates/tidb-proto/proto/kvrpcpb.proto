// Source: github.com/pingcap/kvproto/proto/kvrpcpb.proto
//
// Dependency-closed projection of the request context plus the bounded
// optimistic transaction commands used by the retained BatchCommands path.
// Field numbers and wire types are exact; unrelated transaction commands and
// imported resource-manager payloads are intentionally absent.
syntax = "proto3";

package kvrpcpb;

import "errorpb.proto";

message RegionEpoch {
  uint64 conf_ver = 1;
  uint64 version = 2;
}

message Peer {
  uint64 id = 1;
  uint64 store_id = 2;
  int32 role = 3;
  bool is_witness = 4;
}

enum RequestOrigin {
  RequestOriginUnknown = 0;
  RequestOriginTiDB = 1;
}

enum CommandPri {
  Normal = 0;
  Low = 1;
  High = 2;
}

enum IsolationLevel {
  SI = 0;
  RC = 1;
  RCCheckTS = 2;
}

message SourceStmt {
  uint64 start_ts = 1;
  uint64 connection_id = 2;
  uint64 stmt_id = 3;
  string session_alias = 4;
}

message ResourceControlContext {
  string resource_group_name = 1;
  // Upstream field 2 is resource_manager.Consumption. It is deliberately
  // omitted until that protocol owner exists; field 3 retains its exact tag.
  uint64 override_priority = 3;
}

message Context {
  reserved 4;
  reserved 26;
  uint64 region_id = 1;
  RegionEpoch region_epoch = 2;
  Peer peer = 3;
  uint64 term = 5;
  CommandPri priority = 6;
  IsolationLevel isolation_level = 7;
  bool not_fill_cache = 8;
  bool sync_log = 9;
  bool record_time_stat = 10;
  bool record_scan_stat = 11;
  bool replica_read = 12;
  repeated uint64 resolved_locks = 13;
  uint64 max_execution_duration_ms = 14;
  uint64 applied_index = 15;
  uint64 task_id = 16;
  bool stale_read = 17;
  bytes resource_group_tag = 18;
  int32 disk_full_opt = 19;
  bool is_retry_request = 20;
  int32 api_version = 21;
  repeated uint64 committed_locks = 22;
  string request_source = 24;
  uint64 txn_source = 25;
  uint32 busy_threshold_ms = 27;
  ResourceControlContext resource_control_context = 28;
  RequestOrigin request_origin = 29;
  string keyspace_name = 31;
  uint32 keyspace_id = 32;
  uint64 buckets_version = 33;
  SourceStmt source_stmt = 34;
  uint64 cluster_id = 35;
  bytes trace_id = 36;
  uint64 trace_control_flags = 37;
}

// Exact pinned transactional point read.
message GetRequest {
  Context context = 1;
  bytes key = 2;
  uint64 version = 3;
  bool need_commit_ts = 4;
}

message GetResponse {
  errorpb.Error region_error = 1;
  KeyError error = 2;
  bytes value = 3;
  bool not_found = 4;
  reserved 5;
  // Upstream field 6 is ExecDetailsV2 and is outside this bounded owner.
  uint64 commit_ts = 7;
}

message LockInfo {
  bytes primary_lock = 1;
  uint64 lock_version = 2;
  bytes key = 3;
  uint64 lock_ttl = 4;
  uint64 txn_size = 5;
  int32 lock_type = 6;
  uint64 lock_for_update_ts = 7;
  bool use_async_commit = 8;
  uint64 min_commit_ts = 9;
  repeated bytes secondaries = 10;
  uint64 duration_to_last_update_ms = 11;
  repeated LockInfo shared_lock_infos = 12;
  bool is_txn_file = 100;
}

// Bounded transaction error projection used by optimistic read-lock recovery.
// Omitted variants remain unknown protobuf fields and any present KeyError is
// still fail-closed by the recovery owner.
message TxnNotFound {
  uint64 start_ts = 1;
  bytes primary_key = 2;
}

message PrimaryMismatch {
  LockInfo lock_info = 1;
}

message TxnLockNotFound { bytes key = 1; }

message KeyError {
  LockInfo locked = 1;
  string retryable = 2;
  string abort = 3;
  WriteConflict conflict = 4;
  AlreadyExist already_exist = 5;
  Deadlock deadlock = 6;
  CommitTsExpired commit_ts_expired = 7;
  TxnNotFound txn_not_found = 8;
  CommitTsTooLarge commit_ts_too_large = 9;
  AssertionFailed assertion_failed = 10;
  PrimaryMismatch primary_mismatch = 11;
  TxnLockNotFound txn_lock_not_found = 12;
  // Upstream field 100 is debug-only MVCC metadata.
}

message WriteConflict {
  enum Reason {
    Unknown = 0;
    Optimistic = 1;
    PessimisticRetry = 2;
    SelfRolledBack = 3;
    RcCheckTs = 4;
    LazyUniquenessCheck = 5;
    NotLockedKeyConflict = 6;
  }

  uint64 start_ts = 1;
  uint64 conflict_ts = 2;
  bytes key = 3;
  bytes primary = 4;
  uint64 conflict_commit_ts = 5;
  Reason reason = 6;
}

message AlreadyExist { bytes key = 1; }

// Upstream `Deadlock.wait_chain` is `deadlock.WaitForEntry`. Only the message
// name differs; the wire encoding of an embedded message is independent of its
// declaring package, so this bounded owner keeps the entry local instead of
// importing the whole deadlock-detector service protocol.
message WaitForEntry {
  uint64 txn = 1;
  uint64 wait_for_txn = 2;
  uint64 key_hash = 3;
  bytes key = 4;
  bytes resource_group_tag = 5;
  uint64 wait_time = 6;
}

message Deadlock {
  uint64 lock_ts = 1;
  bytes lock_key = 2;
  uint64 deadlock_key_hash = 3;
  repeated WaitForEntry wait_chain = 4;
  bytes deadlock_key = 5;
}

message CommitTsExpired {
  uint64 start_ts = 1;
  uint64 attempted_commit_ts = 2;
  bytes key = 3;
  uint64 min_commit_ts = 4;
}

message CommitTsTooLarge { uint64 commit_ts = 1; }

message AssertionFailed {
  uint64 start_ts = 1;
  bytes key = 2;
  Assertion assertion = 3;
  uint64 existing_start_ts = 4;
  uint64 existing_commit_ts = 5;
}

enum Op {
  Put = 0;
  Del = 1;
  Lock = 2;
  Rollback = 3;
  Insert = 4;
  PessimisticLock = 5;
  CheckNotExists = 6;
  SharedLock = 7;
  SharedPessimisticLock = 8;
}

enum Assertion {
  None = 0;
  Exist = 1;
  NotExist = 2;
}

enum AssertionLevel {
  Off = 0;
  Fast = 1;
  Strict = 2;
}

message Mutation {
  Op op = 1;
  bytes key = 2;
  bytes value = 3;
  Assertion assertion = 4;
}

message PrewriteRequest {
  enum PessimisticAction {
    SKIP_PESSIMISTIC_CHECK = 0;
    DO_PESSIMISTIC_CHECK = 1;
    DO_CONSTRAINT_CHECK = 2;
  }

  message ForUpdateTSConstraint {
    uint32 index = 1;
    uint64 expected_for_update_ts = 2;
  }

  Context context = 1;
  repeated Mutation mutations = 2;
  bytes primary_lock = 3;
  uint64 start_version = 4;
  uint64 lock_ttl = 5;
  bool skip_constraint_check = 6;
  repeated PessimisticAction pessimistic_actions = 7;
  uint64 txn_size = 8;
  uint64 for_update_ts = 9;
  uint64 min_commit_ts = 10;
  bool use_async_commit = 11;
  repeated bytes secondaries = 12;
  bool try_one_pc = 13;
  uint64 max_commit_ts = 14;
  AssertionLevel assertion_level = 15;
  repeated ForUpdateTSConstraint for_update_ts_constraints = 16;
  repeated uint64 txn_file_chunks = 100;
}

message PrewriteResponse {
  errorpb.Error region_error = 1;
  repeated KeyError errors = 2;
  uint64 min_commit_ts = 3;
  uint64 one_pc_commit_ts = 4;
  // Upstream field 5 is ExecDetailsV2 and is outside this bounded owner.
}

enum CommitRole {
  Unknown = 0;
  Primary = 1;
  Secondary = 2;
}

message CommitRequest {
  reserved 5;
  reserved "binlog";
  Context context = 1;
  uint64 start_version = 2;
  repeated bytes keys = 3;
  uint64 commit_version = 4;
  CommitRole commit_role = 6;
  bytes primary_key = 7;
  bool use_async_commit = 8;
  bool is_txn_file = 100;
}

message CommitResponse {
  errorpb.Error region_error = 1;
  KeyError error = 2;
  uint64 commit_version = 3;
  // Upstream field 4 is ExecDetailsV2 and is outside this bounded owner.
}

message BatchRollbackRequest {
  Context context = 1;
  uint64 start_version = 2;
  repeated bytes keys = 3;
  bool is_txn_file = 100;
}

message BatchRollbackResponse {
  errorpb.Error region_error = 1;
  KeyError error = 2;
  // Upstream field 3 is ExecDetailsV2 and is outside this bounded owner.
}

enum Action {
  NoAction = 0;
  TTLExpireRollback = 1;
  LockNotExistRollback = 2;
  MinCommitTSPushed = 3;
  TTLExpirePessimisticRollback = 4;
  LockNotExistDoNothing = 5;
}

// Exact pinned kvproto command shape used to query an optimistic primary.
message CheckTxnStatusRequest {
  Context context = 1;
  bytes primary_key = 2;
  uint64 lock_ts = 3;
  uint64 caller_start_ts = 4;
  uint64 current_ts = 5;
  bool rollback_if_not_exist = 6;
  bool force_sync_commit = 7;
  bool resolving_pessimistic_lock = 8;
  bool verify_is_primary = 9;
  bool is_txn_file = 100;
}

message CheckTxnStatusResponse {
  errorpb.Error region_error = 1;
  KeyError error = 2;
  uint64 lock_ttl = 3;
  uint64 commit_version = 4;
  Action action = 5;
  LockInfo lock_info = 6;
  // Upstream field 7 is ExecDetailsV2 and is outside this bounded owner.
}

message TxnInfo {
  uint64 txn = 1;
  uint64 status = 2;
  bool is_txn_file = 100;
}

// Exact pinned kvproto command shape used for keyed optimistic lock cleanup.
message ResolveLockRequest {
  Context context = 1;
  uint64 start_version = 2;
  uint64 commit_version = 3;
  repeated TxnInfo txn_infos = 4;
  repeated bytes keys = 5;
  bool is_async = 6;
  bool is_txn_file = 100;
}

message ResolveLockResponse {
  errorpb.Error region_error = 1;
  KeyError error = 2;
  // Upstream field 3 is ExecDetailsV2 and is outside this bounded owner.
}

// Exact pinned kvproto shape for pessimistic lock acquisition.
//
// Only `WakeUpModeNormal` is exercised by this owner: on a wake-up TiKV
// returns the blocking KeyError and the client retries, so every result stays
// in `errors`/`values`/`not_founds`. `WakeUpModeForceLock` and its `results`
// field belong to fair (aggressive) locking, which is outside this boundary.
enum PessimisticLockWakeUpMode {
  WakeUpModeNormal = 0;
  WakeUpModeForceLock = 1;
}

enum PessimisticLockKeyResultType {
  LockResultNormal = 0;
  LockResultLockedWithConflict = 1;
  LockResultFailed = 2;
}

message PessimisticLockKeyResult {
  PessimisticLockKeyResultType type = 1;
  bytes value = 2;
  bool existence = 3;
  uint64 locked_with_conflict_ts = 4;
  bool skip_resolving_lock = 11;
}

message PessimisticLockRequest {
  Context context = 1;
  // Every `Op` must be `PessimisticLock` or `SharedPessimisticLock`.
  repeated Mutation mutations = 2;
  bytes primary_lock = 3;
  uint64 start_version = 4;
  uint64 lock_ttl = 5;
  // Statement-level timestamp. A locking statement that hits a write conflict
  // retries under a newer `for_update_ts` without restarting the transaction.
  uint64 for_update_ts = 6;
  bool is_first_lock = 7;
  // Milliseconds to wait for a conflicting lock. Zero means TiKV's default and
  // a negative value means do not wait.
  int64 wait_timeout = 8;
  bool force = 9 [deprecated = true];
  bool return_values = 10;
  uint64 min_commit_ts = 11;
  bool check_existence = 12;
  bool lock_only_if_exists = 13;
  PessimisticLockWakeUpMode wake_up_mode = 14;
}

message PessimisticLockResponse {
  errorpb.Error region_error = 1;
  repeated KeyError errors = 2;
  uint64 commit_ts = 3 [deprecated = true];
  bytes value = 4 [deprecated = true];
  repeated bytes values = 5;
  repeated bool not_founds = 6;
  // Upstream field 7 is ExecDetailsV2 and is outside this bounded owner.
  repeated PessimisticLockKeyResult results = 8;
}

// Exact pinned kvproto shape for releasing pessimistic locks. An empty `keys`
// list releases every lock the transaction holds in the addressed region,
// which is how lock recovery cleans a whole region in one command.
message PessimisticRollbackRequest {
  Context context = 1;
  uint64 start_version = 2;
  uint64 for_update_ts = 3;
  repeated bytes keys = 4;
}

message PessimisticRollbackResponse {
  errorpb.Error region_error = 1;
  repeated KeyError errors = 2;
  // Upstream field 3 is ExecDetailsV2 and is outside this bounded owner.
}

// Exact pinned kvproto shape used to keep a primary lock alive.
message TxnHeartBeatRequest {
  Context context = 1;
  bytes primary_lock = 2;
  uint64 start_version = 3;
  uint64 advise_lock_ttl = 4;
  uint64 min_commit_ts = 5;
  bool is_txn_file = 100;
}

message TxnHeartBeatResponse {
  errorpb.Error region_error = 1;
  KeyError error = 2;
  uint64 lock_ttl = 3;
  // Upstream field 4 is ExecDetailsV2 and is outside this bounded owner.
}
