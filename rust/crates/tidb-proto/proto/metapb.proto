syntax = "proto3";
package metapb;

enum StoreState {
  Up = 0;
  Offline = 1;
  Tombstone = 2;
}

enum NodeState {
  Preparing = 0;
  Serving = 1;
  Removing = 2;
  Removed = 3;
}

// Case insensitive key/value for replica constraints.
message StoreLabel {
  string key = 1;
  string value = 2;
}

message Store {
  uint64 id = 1;
  string address = 2;
  StoreState state = 3;
  repeated StoreLabel labels = 4;
  NodeState node_state = 13;
}

message RegionEpoch {
  uint64 conf_ver = 1;
  uint64 version = 2;
}

message BucketStats {
  repeated uint64 read_bytes = 1;
  repeated uint64 write_bytes = 2;
  repeated uint64 read_qps = 3;
  repeated uint64 write_qps = 4;
  repeated uint64 read_keys = 5;
  repeated uint64 write_keys = 6;
}

message Buckets {
  uint64 region_id = 1;
  uint64 version = 2;
  repeated bytes keys = 3;
  BucketStats stats = 4;
  uint64 period_in_ms = 5;
}

message Region {
  uint64 id = 1;
  bytes start_key = 2;
  bytes end_key = 3;
  RegionEpoch region_epoch = 4;
  repeated Peer peers = 5;
}

enum PeerRole {
  Voter = 0;
  Learner = 1;
  IncomingVoter = 2;
  DemotingVoter = 3;
}

message Peer {
  uint64 id = 1;
  uint64 store_id = 2;
  PeerRole role = 3;
  bool is_witness = 4;
}
