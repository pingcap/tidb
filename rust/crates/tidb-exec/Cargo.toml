[package]
name = "tidb-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal query executor (projection + selection) — the Phase-1 executor seed."
autotests = false

[lints]
workspace = true

[dependencies]
tidb-ast = { path = "../tidb-ast" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-distsql = { path = "../tidb-distsql" }
tidb-expr = { path = "../tidb-expr" }
tidb-error = { path = "../tidb-error" }
tidb-parser = { path = "../tidb-parser" }
tidb-pd-client = { path = "../tidb-pd-client" }
tidb-planner = { path = "../tidb-planner" }
tidb-proto = { path = "../tidb-proto" }
tidb-protocol = { path = "../tidb-protocol" }
tidb-txnkv = { path = "../tidb-txnkv" }
prost.workspace = true
serde_json = { workspace = true }

[dev-dependencies]

[[test]]
name = "source_shard_a"
path = "tests/source_shard_a.rs"

[[test]]
name = "source_shard_b"
path = "tests/source_shard_b.rs"

