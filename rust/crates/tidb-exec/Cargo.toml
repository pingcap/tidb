[package]
name = "tidb-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB cluster and session subsystems: catalog, DDL, real-TiKV read/write, privileges, sysvars, bootstrap, statistics (Rust rewrite)."
autotests = false
build = "../../scripts/aggregate-tests.rs"

[lints]
workspace = true

[dependencies]
tidb-ast = { path = "../tidb-ast" }
tidb-codec = { path = "../tidb-codec" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-distsql = { path = "../tidb-distsql" }
tidb-expr = { path = "../tidb-expr" }
tidb-meta = { path = "../tidb-meta" }
tidb-metadef = { path = "../tidb-metadef" }
tidb-model = { path = "../tidb-model" }
tidb-error = { path = "../tidb-error" }
tidb-executor = { path = "../tidb-executor" }
tidb-parser = { path = "../tidb-parser" }
tidb-pd-client = { path = "../tidb-pd-client" }
tidb-planner = { path = "../tidb-planner" }
tidb-proto = { path = "../tidb-proto" }
tidb-stats = { path = "../tidb-stats" }
tidb-protocol = { path = "../tidb-protocol" }
tidb-tablecodec = { path = "../tidb-tablecodec" }
tidb-txnkv = { path = "../tidb-txnkv" }
chrono.workspace = true
prost.workspace = true
serde_json = { workspace = true }

[dev-dependencies]

[[test]]
name = "all"
path = "tests/all.rs"

# These schema tests intentionally stay standalone: their source-backed test
# modules compile several implementation files at the integration crate root,
# and those files use `crate::...` imports. Nesting them under a shard would
# change that module topology and either duplicate or alter the tested types.
[[test]]
name = "result_field_resolver_source"
path = "tests/result_field_resolver_source.rs"

[[test]]
name = "result_metadata_source"
path = "tests/result_metadata_source.rs"

[[test]]
name = "result_schema_join_output_source"
path = "tests/result_schema_join_output_source.rs"

[[test]]
name = "result_schema_multi_source"
path = "tests/result_schema_multi_source.rs"

[[test]]
name = "result_schema_projection_source"
path = "tests/result_schema_projection_source.rs"

[[test]]
name = "result_schema_source"
path = "tests/result_schema_source.rs"
