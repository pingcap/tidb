[package]
name = "tidb-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Go pkg/domain (seed): sysvar cache, schema checker, domain context keys, optimize-trace file store."

[lints]
workspace = true

[dependencies]
tidb-error = { path = "../tidb-error" }
tidb-model = { path = "../tidb-model" }
tidb-ast = { path = "../tidb-ast" }
tidb-mysql = { path = "../tidb-mysql" }
# `serverinfo`'s `getServerInfo` reads the global config, exactly as Go's
# `pkg/domain/serverinfo` imports `pkg/config`.
tidb-config = { path = "../tidb-config" }
# The node id Go mints with `uuid.New()` for its DDL owner and publishes as
# `TIDB_SERVERS_INFO.DDL_ID`.
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tidb-vardef = { path = "../tidb-vardef" }
# `ru_stats.go` computes interval buckets from local midnight and documents
# DST as load-bearing; chrono replaces Go's time.Time/time.Location.
chrono.workspace = true

[dev-dependencies]
# The upstream ru_stats test pins Asia/Shanghai and Australia/Lord_Howe.
chrono-tz.workspace = true
