[package]
name = "tidb-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Go pkg/domain (seed): sysvar cache, schema checker, domain context keys, optimize-trace file store."

[lints]
workspace = true

[dependencies]
tidb-dbterror = { path = "../tidb-dbterror" }
tidb-store-driver-txn = { path = "../tidb-store-driver-txn" }
tidb-errno = { path = "../tidb-errno" }
tidb-terror = { path = "../tidb-terror" }
tidb-config-deploymode = { path = "../tidb-config-deploymode" }
tidb-config-kerneltype = { path = "../tidb-config-kerneltype" }
tidb-domain-serverinfo = { path = "../tidb-domain-serverinfo" }
tidb-replayer = { path = "../tidb-replayer" }
tidb-globalconn = { path = "../tidb-globalconn" }
tidb-logutil = { path = "../tidb-logutil" }
tidb-memory = { path = "../tidb-memory" }
tidb-printer = { path = "../tidb-printer" }
tidb-redact = { path = "../tidb-redact" }
tidb-tls = { path = "../tidb-tls" }
tidb-traceevent = { path = "../tidb-traceevent" }
tidb-pd-client = { path = "../tidb-pd-client" }
tidb-txnkv = { path = "../tidb-txnkv" }
tikv-client.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
tidb-fixcontrol = { path = "../tidb-fixcontrol" }
prometheus = { version = "0.14", default-features = false }
toml.workspace = true
tidb-proto = { path = "../tidb-proto" }
tidb-ast = { path = "../tidb-ast" }
tidb-mysql = { path = "../tidb-mysql" }
# `serverinfo`'s `getServerInfo` reads the global config, exactly as Go's
# `pkg/domain/serverinfo` imports `pkg/config`.
tidb-config = { path = "../tidb-config" }
tidb-log = { path = "../tidb-log" }
# The node id Go mints with `uuid.New()` for its DDL owner and publishes as
# `TIDB_SERVERS_INFO.DDL_ID`.
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tidb-vardef = { path = "../tidb-vardef" }
# Go `pkg/domain` imports `pkg/sessionctx/variable`: the GLOBAL accessor the
# session installs answers from the domain's sysvar cache over its registry.
tidb-variable = { path = "../tidb-variable" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-stmtsummary = { path = "../tidb-stmtsummary" }
tidb-tikvutil = { path = "../tidb-tikvutil" }
tidb-stats-handle-metrics = { path = "../tidb-stats-handle-metrics" }
# `ru_stats.go` computes interval buckets from local midnight and documents
# DST as load-bearing; chrono replaces Go's time.Time/time.Location.
chrono.workspace = true
base64.workspace = true

[dev-dependencies]
tidb-parser = { path = "../tidb-parser" }
# The upstream ru_stats test pins Asia/Shanghai and Australia/Lord_Howe.
chrono-tz.workspace = true
