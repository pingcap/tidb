[package]
name = "tidb-txnkv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Source-backed transactional KV primitives for the TiDB Rust rewrite."
autotests = false

[lints]
workspace = true

[dependencies]
tidb-dbterror = { path = "../tidb-dbterror" }
tidb-errno = { path = "../tidb-errno" }
tidb-terror = { path = "../tidb-terror" }
tidb-mysql = { path = "../tidb-mysql" }
tidb-trxevents = { path = "../tidb-trxevents" }
tidb-tiflash = { path = "../tidb-tiflash" }
tidb-resourcegrouptag = { path = "../tidb-resourcegrouptag" }
tidb-go-time-layout = { path = "../tidb-go-time-layout" }
tidb-logutil = { path = "../tidb-logutil" }
tidb-paging = { path = "../tidb-paging" }
tidb-tiflashcompute = { path = "../tidb-tiflashcompute" }
tidb-tracing = { path = "../tidb-tracing" }
tidb-metrics = { path = "../tidb-metrics" }
reqwest = { workspace = true, features = ["blocking"] }
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
futures-timer.workspace = true
hyper.workspace = true
prost.workspace = true
serde_json.workspace = true
tidb-codec = { path = "../tidb-codec" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-hack = { path = "../tidb-hack" }
tidb-log = { path = "../tidb-log" }
tidb-proto = { path = "../tidb-proto" }
tidb-pd-client = { path = "../tidb-pd-client" }
tidb-vardef = { path = "../tidb-vardef" }
tikv-client.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
fail = { version = "0.4", optional = true }

[dev-dependencies]
tidb-store-driver-error = { path = "../tidb-store-driver-error" }
tidb-tablecodec = { path = "../tidb-tablecodec" }
tonic-prost.workspace = true

[features]
# Test-only fault injection (`fail::fail_point!`), as tidb-util's.
failpoints = ["dep:fail", "fail/failpoints"]

[[test]]
name = "all"
path = "tests/all.rs"

[[bench]]
name = "kv"
harness = false
