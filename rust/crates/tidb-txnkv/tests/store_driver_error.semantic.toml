# Direct source inventory is exactly BUILD.bazel, error.go and error_test.go.
# TestMain is common testsetup/goleak harness; the converter starts no
# background worker, and the Cargo aggregate owns the Rust harness. The
# package has no failpoint, build-tag, generated, fixture, example, fuzz or
# benchmark artifact. BUILD's short/flaky/shard metadata has no Rust runtime
# semantics. The source pin uses client-go 557a4986e4c4; the current branch
# uses 01bd8f99f4da, and the four passthrough sentinel strings are identical in
# both revisions.
#
# Region/backoff/coordinator files below are downstream evidence for this Go
# package's exact concrete-sentinel-versus-passthrough conversion boundary.
# They do not claim pkg/store/driver/txn, client-go retry, or every region
# recovery call site as a completed transcreation. In particular, the AutoID
# domain's retry/error transport remains owned by pkg/meta/autoid. The
# TxnNotFound conversion-table row is defensive evidence only: Rust prewrite's
# local 20-second resolver budget is not Go's shared 40-second backoffer and is
# deliberately kept generic until that txn-owned budget seam is transcreated.
