# Go's TestMain is testsetup/goleak harness wiring; Cargo owns the Rust test
# harness and this package starts no background worker. The failpoint-aware Go
# oracle is run separately with ./tools/check/failpoint-go-test.sh pkg/kv
# -count=1. Rust exercises the injected retry-once commit through a
# deterministic transaction seam, and exercises resource-group propagation on
# the physical Prewrite, Commit, and PessimisticLock BatchCommands paths. Go's
# three microbenchmarks have no stable timing oracle, so the Rust benchmark is
# compile-checked below.
