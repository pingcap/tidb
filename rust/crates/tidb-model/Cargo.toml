[package]
name = "tidb-model"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB meta/model: schema/table metadata types (Rust rewrite, in progress)."

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
tidb-errno = { path = "../tidb-errno" }
tidb-terror = { path = "../tidb-terror" }
tidb-parser-types = { path = "../tidb-parser-types" }
tidb-planner-cascades-base = { path = "../tidb-planner-cascades-base" }
tidb-goruntime = { path = "../tidb-goruntime" }
tidb-ast = { path = "../tidb-ast" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-hack = { path = "../tidb-hack" }
tidb-mysql = { path = "../tidb-mysql" }
tidb-parser = { path = "../tidb-parser" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
serde = { workspace = true }
# Go's interface{} decoder requires correctly rounded binary64 values for every
# JSON number, including hard decimals. Keep that behavior local to model JSON.
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
