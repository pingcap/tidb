[package]
name = "tidb-sem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB util/sem: Go pkg/util/sem (Rust rewrite)."

[lints]
workspace = true

[features]
enableassert = ["tidb-intest/enableassert", "tidb-logutil/enableassert"]
intest = ["tidb-intest/intest", "tidb-logutil/intest"]

[dependencies]
tidb-variable = { path = "../tidb-variable" }
tidb-intest = { path = "../tidb-intest" }
tidb-logutil = { path = "../tidb-logutil" }
rustix = { workspace = true, features = ["fs", "pipe", "stdio", "system", "thread"] }

[target.'cfg(windows)'.dependencies]
fs4 = { version = "=1.1.0", default-features = false }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tidb-intest = { path = "../tidb-intest", features = ["intest"] }
