[package]
name = "tidb-autoid-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Go pkg/autoid_service (the AUTO_ID_CACHE 1 allocation service) for the TiDB Rust rewrite."

[lints]
workspace = true

[dependencies]
tidb-autoid = { path = "../tidb-autoid" }
tidb-meta = { path = "../tidb-meta" }
tidb-owner = { path = "../tidb-owner" }
tidb-failpoint = { path = "../tidb-failpoint" }
tidb-gocontext = { path = "../tidb-gocontext" }
tidb-txnkv = { path = "../tidb-txnkv" }
tidb-log = { path = "../tidb-log" }
tidb-logutil = { path = "../tidb-logutil" }
tikv-client.workspace = true
tonic.workspace = true
tokio.workspace = true

[dev-dependencies]
tidb-failpoint = { path = "../tidb-failpoint", features = ["failpoints"] }
tidb-ddl = { path = "../tidb-ddl" }
tokio-stream = { workspace = true, features = ["net"] }
