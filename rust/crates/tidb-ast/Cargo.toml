[package]
name = "tidb-ast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB SQL abstract syntax tree (Rust)."
autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true

[dependencies]
tidb-terror = { path = "../tidb-terror" }
tidb-parser-format = { path = "../tidb-parser-format" }
tidb-parser-opcode = { path = "../tidb-parser-opcode" }
tidb-parser-util = { path = "../tidb-parser-util" }
serde.workspace = true
serde_json.workspace = true
tidb-charset = { path = "../tidb-charset" }
tidb-goruntime = { path = "../tidb-goruntime" }
tidb-parser-types = { path = "../tidb-parser-types" }
tidb-lexer = { path = "../tidb-lexer" }
tidb-mysql = { path = "../tidb-mysql" }

[dev-dependencies]
serde_json.workspace = true
# `pkg/parser/ast`'s own Go tests live in external package `ast_test` and
# import `github.com/pingcap/tidb/pkg/parser` to drive their Restore tests;
# this dev-dependency is the same relationship (dev-dependency cycles are
# permitted because tidb-parser's normal dependency on tidb-ast is unchanged).
tidb-parser = { path = "../tidb-parser" }

[[bench]]
name = "base_source"
harness = false
