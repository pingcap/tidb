[package]
name = "tidb-resourcemanager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB local instance resource manager."

[lints]
workspace = true

[features]
default = []
failpoints = ["dep:fail", "fail/failpoints", "tidb-build-tags/failpoints"]
intest = ["tidb-build-tags/intest"]

[dependencies]
tidb-cpu = { path = "../tidb-cpu" }
tidb-intest = { path = "../tidb-intest" }
crossbeam-channel = "0.5"
fail = { version = "0.4", optional = true }
getrandom.workspace = true
prometheus = { version = "0.14", default-features = false }
tracing = "0.1"

[dev-dependencies]
tidb-cgroup = { path = "../tidb-cgroup" }
rand = "0.8.7"
tidb-build-tags = { path = "../tidb-build-tags", features = ["intest"] }
