[package]
name = "tidb-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB executor: the wired execution engine spine (Executor trait + operators) (Rust rewrite)."

autotests = false

[features]
# Test hooks other crates' tests read (the digest-call counter).
test-util = []

[dependencies]
tidb-sessionstates = { path = "../tidb-sessionstates" }
tidb-privilege = { path = "../tidb-privilege" }
tidb-keydecoder = { path = "../tidb-keydecoder" }
tidb-deadlockhistory = { path = "../tidb-deadlockhistory" }
tidb-variable = { path = "../tidb-variable" }
tidb-kv = { path = "../tidb-kv" }
tidb-autoid = { path = "../tidb-autoid" }
tidb-table = { path = "../tidb-table" }
tidb-sessionctx = { path = "../tidb-sessionctx" }
tidb-driver-error = { path = "../tidb-driver-error" }
tidb-infoschema = { path = "../tidb-infoschema" }
tidb-stats-handle = { path = "../tidb-stats-handle" }
tidb-ddl-build = { path = "../tidb-ddl-build" }
tidb-ddl = { path = "../tidb-ddl" }
tidb-cluster = { path = "../tidb-cluster" }
tidb-ddl-label = { path = "../tidb-ddl-label" }
tidb-domain = { path = "../tidb-domain" }
tidb-lexer = { path = "../tidb-lexer" }
tidb-log = { path = "../tidb-log" }
tidb-workloadrepo = { path = "../tidb-workloadrepo" }
tidb-stats-handle-util = { path = "../tidb-stats-handle-util" }
tidb-pd-client = { path = "../tidb-pd-client" }
tidb-sysutil = { path = "../tidb-sysutil" }
tidb-stmtsummary = { path = "../tidb-stmtsummary" }
tidb-bindinfo = { path = "../tidb-bindinfo" }
futures.workspace = true
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { workspace = true }
tonic.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
signal-hook = { workspace = true }
prometheus = { version = "0.14", default-features = false }
base64 = { workspace = true }
stacker = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
crc32fast = { workspace = true }
crossbeam-channel = "0.5"
flate2 = { workspace = true }
encoding_rs.workspace = true
zstd.workspace = true
snap.workspace = true
hashbrown = { workspace = true }
prost = { workspace = true }
smallvec = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tikv-client = { workspace = true }
tidb-hack = { path = "../tidb-hack" }
tidb-ast = { path = "../tidb-ast" }
tidb-hint = { path = "../tidb-hint" }
tidb-chunk = { path = "../tidb-chunk" }
tidb-codec = { path = "../tidb-codec" }
tidb-config = { path = "../tidb-config" }
tidb-ddl-session = { path = "../tidb-ddl-session" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-distsql = { path = "../tidb-distsql" }
tidb-error = { path = "../tidb-error" }
tidb-expr = { path = "../tidb-expr" }
tidb-funcdep = { path = "../tidb-funcdep" }
tidb-metadef = { path = "../tidb-metadef" }
tidb-model = { path = "../tidb-model" }
tidb-mysql = { path = "../tidb-mysql" }
tidb-parser = { path = "../tidb-parser" }
tidb-planner = { path = "../tidb-planner" }
tidb-proto = { path = "../tidb-proto" }
tidb-resolve = { path = "../tidb-resolve" }
tidb-sqlexec = { path = "../tidb-sqlexec" }
tidb-stats = { path = "../tidb-stats" }
tidb-stats-handle-metrics = { path = "../tidb-stats-handle-metrics" }
tidb-stats-handle-usage = { path = "../tidb-stats-handle-usage" }
tidb-stats-handle-usage-indexusage = { path = "../tidb-stats-handle-usage-indexusage" }
tidb-tablecodec = { path = "../tidb-tablecodec" }
tidb-txnkv = { path = "../tidb-txnkv" }
tidb-util = { path = "../tidb-util" }
tidb-vardef = { path = "../tidb-vardef" }
tracing = "0.1"

[dev-dependencies]
tidb-sessionctx = { path = "../tidb-sessionctx", features = ["test-util"] }
tidb-kv = { path = "../tidb-kv", features = ["test-util"] }
tidb-table = { path = "../tidb-table", features = ["test-util"] }
# Go's executor tests run over mockstore's unistore; the coprocessor reader's
# tests answer its DAG with the same coprocessor.
tidb-unistore = { path = "../tidb-unistore" }
sha2 = { workspace = true }
tempfile.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
# The bench runs on the server's allocator (crates/tidb-server default feature).
tikv-jemallocator = "0.7"

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

[[bench]]
name = "partition_pruning"
harness = false

[[bench]]
name = "pipeline"
harness = false

