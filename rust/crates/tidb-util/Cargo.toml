[package]
name = "tidb-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Complete TiDB utility package transcreations shared by the Rust SQL node."
build = "build.rs"

[lints]
workspace = true

[features]
default = []
enableassert = []
intest = []
race = []
testexport = []
## Reads live-allocation counters from the running jemalloc (via `tidb-hack`),
## the Go-`HeapAlloc`-equivalent input the memory arbitrator samples.
jemalloc = ["tidb-hack/jemalloc"]

[build-dependencies]
chrono.workspace = true

[dependencies]
base64.workspace = true
crossbeam-channel = "0.5"
flate2.workspace = true
prost.workspace = true
snap.workspace = true
tidb-log = { path = "../tidb-log" }
tidb-config = { path = "../tidb-config" }
tidb-kvcache = { path = "../tidb-kvcache" }
tidb-metadef = { path = "../tidb-metadef" }
tidb-mysql = { path = "../tidb-mysql" }
tidb-naming = { path = "../tidb-naming" }
tidb-proto = { path = "../tidb-proto" }
tidb-tikvutil = { path = "../tidb-tikvutil" }
aes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
crc32fast.workspace = true
des.workspace = true
getrandom.workspace = true
num-traits.workspace = true
nix.workspace = true
prometheus = { version = "0.14", default-features = false }
regex.workspace = true
regex-syntax.workspace = true
rustix = { workspace = true, features = ["fs", "system", "thread"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tempfile.workspace = true
tidb-datatype = { path = "../tidb-datatype" }
tidb-error = { path = "../tidb-error" }
tidb-hack = { path = "../tidb-hack" }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
fs4 = { version = "=1.1.0", default-features = false }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
sha2.workspace = true
standard-fastrand = { package = "fastrand", version = "2" }

[[bench]]
name = "encrypt"
harness = false

[[bench]]
name = "fastrand"
harness = false

[[bench]]
name = "sqlescape"
harness = false

[[bench]]
name = "zeropool"
harness = false
