[dev-dependencies]
flate2 = "1"
tidb-sem-v2 = { path = "../tidb-sem-v2" }
tidb-ddl = { path = "../tidb-ddl", features = ["failpoints"] }
tidb-build-tags = { path = "../tidb-build-tags", features = ["failpoints"] }
fail = { version = "0.4", features = ["failpoints"] }
prost.workspace = true
# The TLS tests act as a real client against this node's own material.
rcgen.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
tidb-parser = { path = "../tidb-parser" }
# The session-token login presents a token this process signs.
tempfile.workspace = true
# The integration corpus's script parser and comparison, driven over the
# embedded store by `cluster_session_node::tests::corpus_unistore`.
difftest-result-tests = { path = "../../difftests/result-tests" }

# Manual cluster diagnostic; ordinary package builds only link tidb-server.
[[bin]]
name = "cluster-session-smoke"
path = "src/bin/cluster-session-smoke.rs"
required-features = ["diagnostics"]

[[test]]
name = "all"
path = "tests/all.rs"

[features]
# Opt in only for the maintained RealTiKV diagnostic runners.
diagnostics = []
# Go's `nextgen` build tag: `cargo build -p tidb-server --features nextgen`
# selects the Next Generation kernel (`tidb_config::kerneltype::is_next_gen`),
# whose bootstrap lays the `mysql` schema out at reserved ids. The default
# build is the Classic kernel, whose bootstrap runs ordinary DDL jobs.
nextgen = ["tidb-config/nextgen"]
# Production TiKV ships jemalloc, and this node statement path is
# allocation-heavy: the default build therefore runs on tikv-jemallocator
# (the global_allocator in src/bin/tidb-server.rs). The opt-out exists
# for builds that must stay on the platform allocator.
default = ["jemalloc"]
failpoints = [
    "dep:fail",
    "fail/failpoints",
    "tidb-ddl/failpoints",
    "tidb-ddl-serverstate/failpoints",
    "tidb-resourcemanager/failpoints",
    "tidb-resourcemanager-pool-workerpool/failpoints",
    "tidb-stats-handle-cache/failpoints",
    "tidb-build-tags/failpoints",
]
jemalloc = [
    "dep:tikv-jemallocator",
    "dep:tikv-jemalloc-sys",
    "tidb-build-tags/jemalloc",
    "tikv-jemallocator/profiling",
]
