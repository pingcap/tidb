[package]
name = "tidb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Source-shaped TiDB SQL connection dispatch (Rust)."
autotests = false
build = "../../scripts/aggregate-tests.rs"

[lints]
workspace = true

[dependencies]
base64.workspace = true
tikv-jemallocator = { version = "0.7", optional = true }
tikv-jemalloc-sys = { version = "0.7", optional = true }
ctrlc.workspace = true
signal-hook.workspace = true
rcgen.workspace = true
rustix.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true
tidb-chunk = { path = "../tidb-chunk" }
tidb-ast = { path = "../tidb-ast" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-distsql = { path = "../tidb-distsql" }
tidb-exec = { path = "../tidb-exec" }
tidb-planner = { path = "../tidb-planner" }
tidb-unistore = { path = "../tidb-unistore" }
tidb-executor = { path = "../tidb-executor" }
tidb-error = { path = "../tidb-error" }
tidb-model = { path = "../tidb-model" }
tidb-mysql = { path = "../tidb-mysql" }
tidb-pd-client = { path = "../tidb-pd-client" }
# `pkg/domain/serverinfo`'s syncer: this node's /tidb/server/info entry.
tidb-domain = { path = "../tidb-domain" }
tidb-parser = { path = "../tidb-parser" }
tidb-protocol = { path = "../tidb-protocol" }
tidb-session = { path = "../tidb-session" }
tidb-txnkv = { path = "../tidb-txnkv" }
tikv-client.workspace = true
tidb-util = { path = "../tidb-util" }
serde_json = { workspace = true }
tidb-config = { path = "../tidb-config" }
toml.workspace = true

[dev-dependencies]
prost.workspace = true
# The TLS tests act as a real client against this node's own material.
rcgen.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
tidb-parser = { path = "../tidb-parser" }
tidb-proto = { path = "../tidb-proto" }
tidb-tablecodec = { path = "../tidb-tablecodec" }

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "auth_session_source"
path = "tests/auth_session_source.rs"

[[test]]
name = "configured_user_store_source"
path = "tests/configured_user_store_source.rs"

[features]
# Production TiKV ships jemalloc, and this node statement path is
# allocation-heavy: the default build therefore runs on tikv-jemallocator
# (the global_allocator in src/bin/tidb-server.rs). The opt-out exists
# for builds that must stay on the platform allocator.
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys"]
