go_package = "pkg/session/cursor"
source_commit = "1b0a54ca8690b6f8b040baaa3ecab9367f4c0bf2"
# Direct source inventory is exactly BUILD.bazel, state.go, tracker.go and
# tracker_test.go. BUILD declares state.go/tracker.go plus the short, flaky,
# five-shard tracker_test.go target; those scheduling flags have no Rust
# runtime meaning. tracker_test.go owns TestNewCursor, TestGetCursor,
# TestRangeCursor, TestCursorHandleClose and
# TestCursorTrackerConcurrentCreateDelete. The package has no TestMain,
# benchmark, failpoint, build tag, generated input, fixture, example or fuzz
# artifact.
#
# Go keeps a detached record set's MVCC snapshot alive across FETCH. Its
# session CursorTracker therefore allocates a private handle, exposes StartTS
# through RangeCursor to infosync.ReportMinStartTS, and removes the handle on
# Close. Rust deliberately eliminates that owner instead of copying an unused
# sync-map API: every point/general prepared cursor goes through
# open_prepared_cursor -> CursorState::materialize_result, drains the complete
# ResultSetSource into an owned RowContainer, calls finish and close, then the
# connection drops QueryResult before installing CursorState in the
# statement-ID registry. CursorState retains no source, transaction, snapshot
# or StartTS, and COM_STMT_FETCH reads only its RowContainerReader. The
# worker-local prepared registry already owns replacement, reset, close,
# exhaustion and connection-drop lifecycle, so Go's independent ID/Get/Range
# and concurrent-map behaviors have no surviving consumer to port.
#
# The focused TCP regression uses COM_PING as an event-loop barrier after
# COM_STMT_EXECUTE and before the first FETCH. It proves source drain, finish,
# close, source drop and snapshot-lease release have all completed, then proves
# FETCH returns the retained row without changing any storage lifecycle count.
# The other commands pin resource cleanup, the general prepared-cursor path,
# and typed cursor authority on both real node routes. This receipt claims only
# that pkg/session/cursor's StartTS tracker is semantically eliminated; it does
# not claim all MySQL prepared-statement protocol behavior.
