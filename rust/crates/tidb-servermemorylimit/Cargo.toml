[package]
name = "tidb-servermemorylimit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB util/servermemorylimit: Go pkg/util/servermemorylimit (Rust rewrite)."

[lints]
workspace = true

[features]
enableassert = ["tidb-logutil/enableassert", "tidb-memory/enableassert", "tidb-memoryusagealarm/enableassert", "tidb-sqlkiller/enableassert"]
failpoints = ["dep:fail", "fail/failpoints", "tidb-memory/failpoints", "tidb-memoryusagealarm/failpoints", "tidb-sqlkiller/failpoints"]
intest = ["tidb-logutil/intest", "tidb-memory/intest", "tidb-memoryusagealarm/intest", "tidb-sqlkiller/intest"]
jemalloc = ["tidb-memory/jemalloc", "tidb-memoryusagealarm/jemalloc"]
testexport = ["tidb-memoryusagealarm/testexport"]

[dependencies]
tidb-logutil = { path = "../tidb-logutil" }
tidb-memory = { path = "../tidb-memory" }
tidb-memoryusagealarm = { path = "../tidb-memoryusagealarm" }
tidb-sqlkiller = { path = "../tidb-sqlkiller" }
tidb-log = { path = "../tidb-log" }
chrono.workspace = true
tidb-datatype = { path = "../tidb-datatype" }
fail = { version = "0.4", optional = true }

[dev-dependencies]
tidb-intest = { path = "../tidb-intest", features = ["intest"] }
