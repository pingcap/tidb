[package]
name = "tidb-lightning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB lightning packages: Go pkg/lightning (Rust rewrite)."

[dependencies]
tidb-extsort = { path = "../tidb-extsort" }
tidb-logutil = { path = "../tidb-logutil" }
tidb-promutil = { path = "../tidb-promutil" }
getrandom.workspace = true
rustix = { workspace = true, features = ["fs", "pipe", "stdio", "system", "thread"] }
tidb-datatype = { path = "../tidb-datatype" }
tidb-model = { path = "../tidb-model" }
tonic.workspace = true
tracing = "0.1"
chrono.workspace = true
crossbeam-channel = "0.5"
prometheus = { version = "0.14", default-features = false }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tidb-codec = { path = "../tidb-codec" }
tidb-log = { path = "../tidb-log" }
tidb-util = { path = "../tidb-util" }
tikv-client.workspace = true

[dev-dependencies]
standard-fastrand = { package = "fastrand", version = "2" }
tempfile.workspace = true

[[bench]]
name = "membuf"
harness = false

[lints]
workspace = true
