[package]
name = "tidb-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Session lifecycle and state authority for the TiDB Rust rewrite."

autotests = false

[dependencies]
tidb-privilege = { path = "../tidb-privilege" }
tidb-ddl-label = { path = "../tidb-ddl-label" }
tidb-ristretto = { path = "../tidb-ristretto" }
prometheus = { version = "0.14", default-features = false }
tidb-config = { path = "../tidb-config" }
# `information_schema.TIDB_SERVERS_INFO` reads the server-info syncer, the
# same source Go's `setDataForServersInfo` reads through `GetAllServerInfo`.
tidb-domain = { path = "../tidb-domain" }
tidb-error = { path = "../tidb-error" }
tidb-cluster = { path = "../tidb-cluster" }
tidb-exec = { path = "../tidb-exec" }
tidb-gcutil = { path = "../tidb-gcutil" }
tidb-hint = { path = "../tidb-hint" }
tidb-ast = { path = "../tidb-ast" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
tidb-datatype = { path = "../tidb-datatype" }
tidb-hack = { path = "../tidb-hack" }
tidb-chunk = { path = "../tidb-chunk" }
tidb-metadef = { path = "../tidb-metadef" }
tidb-model = { path = "../tidb-model" }
tidb-executor = { path = "../tidb-executor" }
tidb-ddl-build = { path = "../tidb-ddl-build" }
tidb-expr = { path = "../tidb-expr" }
tidb-mysql = { path = "../tidb-mysql" }
tidb-naming = { path = "../tidb-naming" }
tidb-lexer = { path = "../tidb-lexer" }
tidb-parser = { path = "../tidb-parser" }
tidb-planner = { path = "../tidb-planner" }
# The diagnostics service contract and `sysutil.ParseLogLevel`, which Go's
# cluster server-info and log retrievers use.
tidb-proto = { path = "../tidb-proto" }
tidb-sysutil = { path = "../tidb-sysutil" }
# Go `asyncDelayShutdown` raises SIGTERM to this process for `SHUTDOWN`.
signal-hook = { workspace = true }
tidb-stats = { path = "../tidb-stats" }
tidb-stats-handle-util = { path = "../tidb-stats-handle-util" }
tidb-stats-handle-usage = { path = "../tidb-stats-handle-usage" }
tidb-stats-handle-usage-indexusage = { path = "../tidb-stats-handle-usage-indexusage" }
tidb-stmtsummary = { path = "../tidb-stmtsummary" }
tidb-txnkv = { path = "../tidb-txnkv" }
tidb-tikvutil = { path = "../tidb-tikvutil" }
tidb-util = { path = "../tidb-util" }
tidb-vardef = { path = "../tidb-vardef" }
tidb-sessionstates = { path = "../tidb-sessionstates" }
tidb-variable = { path = "../tidb-variable" }
tidb-workloadrepo = { path = "../tidb-workloadrepo" }
tidb-log = { path = "../tidb-log" }
tidb-codec = { path = "../tidb-codec" }
# The PD-backed memory tables ask PD through the store's PD HTTP client
# (Go `helper.Storage.GetPDHTTPClient()`).
tikv-client.workspace = true
toml.workspace = true
serde_json.workspace = true
serde.workspace = true
futures.workspace = true
prost.workspace = true
tokio.workspace = true
rand = "0.10"
base64.workspace = true
crossbeam-channel = "0.5"
openssl = "0.10.81"
rcgen.workspace = true
rustix = { workspace = true, features = ["net"] }
nix = { workspace = true, features = ["socket", "user"] }
rustls.workspace = true
rustls-pemfile.workspace = true
x509-parser = { version = "=0.18.1", default-features = false }
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true
tidb-ddl = { path = "../tidb-ddl" }
tidb-ddl-logutil = { path = "../tidb-ddl-logutil" }
tidb-ddl-notifier = { path = "../tidb-ddl-notifier" }
tidb-ddl-serverstate = { path = "../tidb-ddl-serverstate" }
tidb-ddl-session = { path = "../tidb-ddl-session" }
tidb-distsql = { path = "../tidb-distsql" }
tidb-dxf = { path = "../tidb-dxf" }
tidb-unistore = { path = "../tidb-unistore" }
tidb-meta = { path = "../tidb-meta" }
tidb-errmsg = { path = "../tidb-errmsg" }
tidb-pd-client = { path = "../tidb-pd-client" }
tidb-placement = { path = "../tidb-placement" }
tidb-owner = { path = "../tidb-owner" }
tidb-stats-handle-metrics = { path = "../tidb-stats-handle-metrics" }
tidb-protocol = { path = "../tidb-protocol" }
tidb-schemaver = { path = "../tidb-schemaver" }
tidb-stats-handle-cache = { path = "../tidb-stats-handle-cache" }
tidb-stats-handle-autoanalyze-exec = { path = "../tidb-stats-handle-autoanalyze-exec" }
tidb-stats-handle-autoanalyze-priorityqueue = { path = "../tidb-stats-handle-autoanalyze-priorityqueue" }
tidb-stats-handle-autoanalyze-refresher = { path = "../tidb-stats-handle-autoanalyze-refresher" }
tidb-stats-handle-initstats = { path = "../tidb-stats-handle-initstats" }
tidb-stats-handle-logutil = { path = "../tidb-stats-handle-logutil" }
tidb-tablecodec = { path = "../tidb-tablecodec" }
async-trait.workspace = true
ctrlc.workspace = true
tidb-gcworker = { path = "../tidb-gcworker" }
tidb-sqlexec = { path = "../tidb-sqlexec" }
tidb-syssession = { path = "../tidb-syssession" }
tidb-resolve = { path = "../tidb-resolve" }
tidb-resourcemanager = { path = "../tidb-resourcemanager" }

[dev-dependencies]
tidb-exec = { path = "../tidb-exec", features = ["failpoints"] }
tidb-util = { path = "../tidb-util", features = ["failpoints"] }
fail = { version = "0.4", features = ["failpoints"] }
# `tests_dml_lock_keys` classifies the raw keys a DML statement leaves behind
# as record or index keys, which is `tablecodec`'s judgement to make.
tidb-tablecodec = { path = "../tidb-tablecodec" }

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "topn_assisted_string_match"
path = "tests/topn_assisted_string_match.rs"

[[test]]
name = "cardinality_stats_loading"
path = "tests/cardinality_stats_loading.rs"

[[test]]
name = "fk_global_policy"
path = "tests/fk_global_policy.rs"

# Go's serial tests: each mutates process-wide state (the global config, or a
# sysvar Go keeps in a process atomic), so they run in their own process,
# serialized among themselves by `support::testkit`'s serial lock.
[[test]]
name = "serial"
path = "tests/serial.rs"
