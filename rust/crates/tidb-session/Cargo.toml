[package]
name = "tidb-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Session lifecycle and state authority for the TiDB Rust rewrite."

[dependencies]
tidb-ast = { path = "../tidb-ast" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
tidb-datatype = { path = "../tidb-datatype" }
tidb-executor = { path = "../tidb-executor" }
tidb-mysql = { path = "../tidb-mysql" }
tidb-naming = { path = "../tidb-naming" }
tidb-parser = { path = "../tidb-parser" }
tidb-planner = { path = "../tidb-planner" }
tidb-util = { path = "../tidb-util" }
tidb-vardef = { path = "../tidb-vardef" }

[dev-dependencies]
# `tests_dml_lock_keys` classifies the raw keys a DML statement leaves behind
# as record or index keys, which is `tablecodec`'s judgement to make.
tidb-tablecodec = { path = "../tidb-tablecodec" }

[lints]
workspace = true
