[package]
name = "tidb-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Session lifecycle and state authority for the TiDB Rust rewrite."

autotests = false

[dependencies]
tidb-ristretto = { path = "../tidb-ristretto" }
prometheus = { version = "0.14", default-features = false }
tidb-config = { path = "../tidb-config" }
# `information_schema.TIDB_SERVERS_INFO` reads the server-info syncer, the
# same source Go's `setDataForServersInfo` reads through `GetAllServerInfo`.
tidb-domain = { path = "../tidb-domain" }
tidb-error = { path = "../tidb-error" }
tidb-exec = { path = "../tidb-exec" }
tidb-gcutil = { path = "../tidb-gcutil" }
tidb-hint = { path = "../tidb-hint" }
tidb-ast = { path = "../tidb-ast" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
tidb-datatype = { path = "../tidb-datatype" }
tidb-chunk = { path = "../tidb-chunk" }
tidb-metadef = { path = "../tidb-metadef" }
tidb-model = { path = "../tidb-model" }
tidb-executor = { path = "../tidb-executor" }
tidb-expr = { path = "../tidb-expr" }
tidb-mysql = { path = "../tidb-mysql" }
tidb-naming = { path = "../tidb-naming" }
tidb-lexer = { path = "../tidb-lexer" }
tidb-parser = { path = "../tidb-parser" }
tidb-planner = { path = "../tidb-planner" }
# The diagnostics service contract and `sysutil.ParseLogLevel`, which Go's
# cluster server-info and log retrievers use.
tidb-proto = { path = "../tidb-proto" }
tidb-sysutil = { path = "../tidb-sysutil" }
# Go `asyncDelayShutdown` raises SIGTERM to this process for `SHUTDOWN`.
signal-hook = { workspace = true }
tidb-stats = { path = "../tidb-stats" }
tidb-stats-handle-util = { path = "../tidb-stats-handle-util" }
tidb-stats-handle-usage = { path = "../tidb-stats-handle-usage" }
tidb-stats-handle-usage-indexusage = { path = "../tidb-stats-handle-usage-indexusage" }
tidb-stmtsummary = { path = "../tidb-stmtsummary" }
tidb-txnkv = { path = "../tidb-txnkv" }
tidb-tikvutil = { path = "../tidb-tikvutil" }
tidb-util = { path = "../tidb-util" }
tidb-vardef = { path = "../tidb-vardef" }
tidb-workloadrepo = { path = "../tidb-workloadrepo" }
tidb-log = { path = "../tidb-log" }
tidb-codec = { path = "../tidb-codec" }
# The PD-backed memory tables ask PD through the store's PD HTTP client
# (Go `helper.Storage.GetPDHTTPClient()`).
tikv-client.workspace = true
toml.workspace = true
serde_json.workspace = true
serde.workspace = true

[dev-dependencies]
# `tests_dml_lock_keys` classifies the raw keys a DML statement leaves behind
# as record or index keys, which is `tablecodec`'s judgement to make.
tidb-tablecodec = { path = "../tidb-tablecodec" }

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "topn_assisted_string_match"
path = "tests/topn_assisted_string_match.rs"

[[test]]
name = "cardinality_stats_loading"
path = "tests/cardinality_stats_loading.rs"

[[test]]
name = "fk_global_policy"
path = "tests/fk_global_policy.rs"
