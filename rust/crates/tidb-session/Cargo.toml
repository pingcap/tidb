# `information_schema.TIDB_SERVERS_INFO` reads the server-info syncer, the
# same source Go's `setDataForServersInfo` reads through `GetAllServerInfo`.
tidb-domain = { path = "../tidb-domain" }
tidb-domain-core = { path = "../tidb-domain-core" }
tidb-gcutil = { path = "../tidb-gcutil" }
tidb-hint = { path = "../tidb-hint" }
tidb-ast = { path = "../tidb-ast" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
tidb-datatype = { path = "../tidb-datatype" }
tidb-hack = { path = "../tidb-hack" }
tidb-chunk = { path = "../tidb-chunk" }
tidb-metadef = { path = "../tidb-metadef" }
tidb-model = { path = "../tidb-model" }
