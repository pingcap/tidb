[dependencies]
tidb-lexer = { path = "../tidb-lexer" }
tidb-ast = { path = "../tidb-ast" }
tidb-mysql = { path = "../tidb-mysql" }
encoding_rs.workspace = true
getrandom.workspace = true
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true
