tidb-parser-util = { path = "../tidb-parser-util" }
tidb-hack = { path = "../tidb-hack" }
tidb-lexer = { path = "../tidb-lexer" }
tidb-ast = { path = "../tidb-ast" }
tidb-charset = { path = "../tidb-charset" }
tidb-mysql = { path = "../tidb-mysql" }
encoding_rs.workspace = true
getrandom.workspace = true
sha1.workspace = true
sha2.workspace = true
