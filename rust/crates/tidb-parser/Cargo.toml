[package]
name = "tidb-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TiDB recursive-descent SQL parser (Rust port of the hand-written parser)."
autotests = false
autobenches = false
build = "../../scripts/aggregate-tests.rs"

[[test]]
name = "all"
path = "tests/all.rs"

[[bench]]
name = "all"
