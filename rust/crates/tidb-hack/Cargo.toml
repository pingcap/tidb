[package]
name = "tidb-hack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Complete transcreation of TiDB's intentionally unsafe pkg/util/hack."

[lints.rust]
missing_docs = "warn"
# `GetBytesFromPtr` is the package's explicit raw-pointer compatibility seam.
# Keep this exception inside the owning crate; the workspace remains `forbid`.
unsafe_code = "allow"

[lints.clippy]
all = "warn"

[dependencies]
foldhash.workspace = true
hashbrown.workspace = true
tikv-jemalloc-sys = { version = "0.7", optional = true }

[features]
default = []
## Exposes [`allocator_stats::sample`]: the running jemalloc's live-allocation
## counters, read through this crate's raw-pointer seam. Only meaningful when
## the process global allocator IS the same tikv-jemalloc-sys instance.
jemalloc = ["dep:tikv-jemalloc-sys"]

[[bench]]
name = "hack"
harness = false
