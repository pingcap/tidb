[package]
name = "tidb-objstore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Go pkg/objstore: storage URL parsing, the storage interface, and the local, memory and cloud storages (Rust rewrite)."

[dependencies]
tidb-ast = { path = "../tidb-ast" }
base64 = { workspace = true }
sha2 = { workspace = true }
tidb-go-url = { path = "../tidb-go-url" }
tidb-objstore-s3like = { path = "../tidb-objstore-s3like" }
tidb-proto = { path = "../tidb-proto" }
tidb-aws-sdk = { path = "../tidb-aws-sdk" }
tidb-failpoint = { path = "../tidb-failpoint" }
tidb-gocontext = { path = "../tidb-gocontext" }
tidb-objstore-recording = { path = "../tidb-objstore-recording" }
flate2 = { workspace = true }
opendal = { version = "=0.55.0", features = ["services-s3", "services-azblob", "services-gcs"] }
anyhow = "1"
async-trait.workspace = true
http = "1"
reqsign = { version = "0.16.5", default-features = false, features = ["services-aws"] }
reqwest12 = { package = "reqwest", version = "0.12.24", default-features = false, features = ["rustls-tls"] }
rustix = { workspace = true, features = ["fs", "process", "system"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
hex = "0.4"
snap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
zstd = { workspace = true }

[dev-dependencies]
prost = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
