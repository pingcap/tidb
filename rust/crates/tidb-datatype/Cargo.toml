[package]
name = "tidb-datatype"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core TiDB SQL data types."
autotests = false

[lints]
workspace = true

[dependencies]
tidb-go-strconv = { path = "../tidb-go-strconv" }
tidb-dbterror = { path = "../tidb-dbterror" }
tidb-errno = { path = "../tidb-errno" }
tidb-terror = { path = "../tidb-terror" }
tidb-context = { path = "../tidb-context" }
tidb-mysql = { path = "../tidb-mysql" }
bytes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
encoding_rs.workspace = true
itoa = "1"
memchr = "2"
num-bigint = "0.4"
num-integer = "0.1"
ryu.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
simdutf8 = { version = "0.1.5", features = ["aarch64_neon"] }
smallvec = { workspace = true, features = ["union"] }
tidb-charset = { path = "../tidb-charset" }
tidb-goruntime = { path = "../tidb-goruntime" }
tidb-parser-format = { path = "../tidb-parser-format" }
tidb-parser-types = { path = "../tidb-parser-types" }
tidb-hack = { path = "../tidb-hack" }
tidb-kvcache = { path = "../tidb-kvcache" }
tidb-stringutil = { path = "../tidb-stringutil" }
unicode-general-category.workspace = true
zerocopy = "0.8"

[dev-dependencies]
sha2 = { workspace = true }

[[test]]
name = "all"
path = "tests/all.rs"

[[bench]]
name = "collate"
harness = false

[[bench]]
name = "json"
harness = false

[[bench]]
name = "time"
harness = false

[[bench]]
name = "decimal"
harness = false

[[bench]]
name = "datum"
harness = false

[[bench]]
name = "parser_charset"
harness = false

[[bin]]
name = "fuzz-json-extract"
path = "fuzz/json_extract.rs"
test = false
bench = false
