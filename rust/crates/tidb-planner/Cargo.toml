[package]
name = "tidb-planner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Source-backed TiDB planner primitives (Rust)."
autotests = false

[lints]
workspace = true

[dependencies]
chrono.workspace = true
prometheus = { version = "0.14", default-features = false }
regex.workspace = true
tidb-hack = { path = "../tidb-hack" }
tidb-ast = { path = "../tidb-ast" }
tidb-chunk = { path = "../tidb-chunk" }
tidb-codec = { path = "../tidb-codec" }
tidb-tablecodec = { path = "../tidb-tablecodec" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-error = { path = "../tidb-error" }
tidb-expr = { path = "../tidb-expr" }
tidb-funcdep = { path = "../tidb-funcdep" }
tidb-hash = { path = "../tidb-hash" }
tidb-hint = { path = "../tidb-hint" }
tidb-metadef = { path = "../tidb-metadef" }
tidb-model = { path = "../tidb-model" }
tidb-mysql = { path = "../tidb-mysql" }
tidb-parser = { path = "../tidb-parser" }
tidb-proto = { path = "../tidb-proto" }
tidb-resolve = { path = "../tidb-resolve" }
tidb-stats = { path = "../tidb-stats" }
tidb-txnkv = { path = "../tidb-txnkv" }
tidb-util = { path = "../tidb-util" }
tidb-vardef = { path = "../tidb-vardef" }

[[test]]
name = "all"
path = "tests/all.rs"
