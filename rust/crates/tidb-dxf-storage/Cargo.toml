[package]
name = "tidb-dxf-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Go pkg/dxf/framework/storage: the distributed execution framework's task and subtask tables."

[lints]
workspace = true

[features]
# Test-only fault injection: Go's `failpoint.Inject`s.
failpoints = ["dep:fail", "fail/failpoints"]

[dependencies]
tidb-gocontext = { path = "../tidb-gocontext" }
chrono.workspace = true
crossbeam-channel = "0.5"
fail = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tidb-config = { path = "../tidb-config" }
tidb-config-kerneltype = { path = "../tidb-config-kerneltype" }
tidb-datatype = { path = "../tidb-datatype" }
tidb-domain-sqlsvrapi = { path = "../tidb-domain-sqlsvrapi" }
tidb-dxf = { path = "../tidb-dxf" }
tidb-dxf-execute = { path = "../tidb-dxf-execute" }
tidb-keyspace = { path = "../tidb-keyspace" }
tidb-sqlescape = { path = "../tidb-sqlescape" }
tidb-sqlexec = { path = "../tidb-sqlexec" }
tidb-store-driver-error = { path = "../tidb-store-driver-error" }
tidb-stringutil = { path = "../tidb-stringutil" }
tidb-syssession = { path = "../tidb-syssession" }
tidb-terror = { path = "../tidb-terror" }
tidb-txnkv = { path = "../tidb-txnkv" }
tidb-vardef = { path = "../tidb-vardef" }
tikv-client.workspace = true
tracing = "0.1"
