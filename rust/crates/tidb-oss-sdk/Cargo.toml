[package]
name = "tidb-oss-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Go Aliyun OSS SDK credential and V4 signing boundary."

[lints]
workspace = true

[dependencies]
reqsign-aliyun-oss = "=3.2.0"
reqsign-core = "=3.3.2"
reqsign-file-read-tokio = "=3.0.7"
reqsign-http-send-reqwest = "=4.0.7"
reqsign = { version = "0.16.5", default-features = false, features = ["services-aliyun", "reqwest_request"] }
reqwest.workspace = true
reqwest12 = { package = "reqwest", version = "0.12.24", default-features = false, features = ["rustls-tls"] }
opendal = { version = "=0.55.0", features = ["services-oss"] }
http = "1"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
url = "2"
percent-encoding = "2"
chrono.workspace = true

tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
