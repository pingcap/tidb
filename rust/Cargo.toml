# `third_party/tikv-client-rs` is a vendored, re-synced copy of
# `ngaut/client-rust` (see rust/docs/client-rust-migration-execplan.md) and
# declares its own `[workspace]` (its `proto-build`/`unistore` helper crates),
# so it cannot also be a member of this workspace. It is consumed as an
# ordinary path dependency (`tikv-client` below) instead.
exclude = ["third_party/tikv-client-rs"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/pingcap/tidb"

# This workspace's first external dependency (see
# `tidb_ast::Expr::Regexp`'s own doc for why it was deliberately
# deferred until now) — real TiDB's own `[NOT] REGEXP`/`RLIKE` uses Go's
# standard-library `regexp` package (confirmed by reading
# `pkg/expression/builtin_regexp_util.go` directly), which is RE2-based;
# the `regex` crate is explicitly designed around the SAME RE2 engine
# (linear-time, no backreferences/lookaround), making it the natural,
# high-fidelity match rather than an arbitrary choice.
[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
futures-timer = "3"
hyper = "1"
encoding_rs = "0.8"
regex = "1"
regex-syntax = "0.8"
# The first generated protocol leaf.  The proto source is checked in under
# `crates/tidb-proto/proto`; keeping prost in the workspace makes subsequent
# tipb/kvproto extraction use one generator and one lockfile.
prost = "0.14"
prost-build = "0.14"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
# Vendored `ngaut/client-rust` (github.com/ngaut/client-rust, a client-go-parity
# fork of the official tikv/client-rust), re-synced by
# scripts/sync-tikv-client-rs.sh. See docs/client-rust-migration-execplan.md.
tikv-client = { path = "third_party/tikv-client-rs" }
# Go TiDB reaches etcd directly (go.mod depends on go.etcd.io/etcd/client/v3,
# not through client-go) for DDL schema-version/privilege/sysvar notification
# on PD's embedded etcd server; this is that same direct dependency's Rust
# counterpart, not a client-rust responsibility. Already pins tonic/prost
# 0.14, matching this workspace exactly. "tls" feature (rustls, matching
# tonic's own tls-ring pin above) is required for ConnectOptions::with_tls,
# used to carry this workspace's ClusterSecurity into etcd connections.
etcd-client = { version = "0.19", features = ["tls"] }
# Hash builtins (MD5/SHA1/SHA2 — `pkg/expression/builtin_encryption.go`
# calls Go's crypto/md5, crypto/sha1, crypto/sha256): the RustCrypto
# crates are the standard, audited implementations of the SAME algorithms
# — hand-rolling cryptographic hashes would be the higher-risk choice.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
# Authentication compares password-equivalent hashes in constant time and
# obtains handshake entropy directly from the operating system.
subtle = "2.6"
getrandom = "0.3"
# Safe process signal delivery for bounded SQL-node graceful shutdown.
ctrlc = { version = "3.4", features = ["termination"] }
signal-hook = { version = "0.3" }
rustix = { version = "1.1", features = ["process"] }
nix = { version = "0.31.3", features = ["resource", "socket"] }
# Go os.Hostname uses GetComputerNameExW on Windows; SEM restores that value.
windows-sys = "0.61"
base64 = "0.22"
snap = "1"
# Secure, atomic temporary spill-file creation. The random-name algorithm is
# an OS/library concern; TiDB's contract is uniqueness, privacy, and exclusive
# creation, all of which `tempfile` provides without a hand-rolled loop.
tempfile = "3.27"
toml = "0.8"
# Go's planner walks arbitrarily nested expressions and subqueries because a
# goroutine's stack GROWS ON DEMAND; a Rust thread's does not, and a debug
# build's planner frames run to hundreds of KB, so eight levels of nesting
# aborted the process. `stacker::maybe_grow` is the direct port of Go's
# semantics -- it moves execution onto a freshly allocated segment when the
# remaining stack drops below a red zone -- and is what rustc itself uses in
# its own recursive walkers.
stacker = "0.1"
# TiDB's `TIDB_SHARD` uses Vitess' exact DES-ECB/null-key hash. RustCrypto's
# audited DES implementation preserves that algorithm without a hand-rolled
# cryptographic primitive.
des = "=0.9.0"
# `pkg/util/encrypt` uses Go's standard-library AES primitive. RustCrypto's
# audited AES implementation supplies the same 128-bit block primitive; TiDB's
# exact ECB/CBC/OFB/CTR/CFB framing stays source-shaped in `tidb-util`.
aes = "0.9"
# JSON builtins (`pkg/expression/builtin_json.go` over TiDB's BinaryJSON):
# serde_json for PARSING/validation only; output formatting is hand-written
# to match TiDB's own text form exactly (spacing differs from serde_json's
# defaults), verified via gorun.
serde_json = "1"
serde_yaml = "0.9"
# Go's `strconv.FormatFloat(..., 'g', -1, 64)` uses shortest-round-trip
# digits; `tidb-datatype` applies Go's fixed/scientific threshold to ryu's
# shortest representation.
ryu = "1.0"
# Go's `unicode.IsPunct` classifies `%.'` in STR_TO_DATE by Unicode general
# category, rather than Rust's ASCII-only punctuation helper.
unicode-general-category = "1.1"
# `JSON_SCHEMA_VALID` follows TiDB's qri-io validator at draft 2019-09,
# including its file and HTTP(S) retrieval of external `$ref` schemas.
jsonschema = { version = "0.49.9", default-features = false, features = ["resolve-file", "resolve-http", "tls-ring"] }
fluent-uri = "0.3"
# PD's placement-rule API is HTTP-only -- `pd/client/http` is what Go reaches
# it through, and neither this tree's gRPC PD client nor `tikv/client-rust`
# exposes it. Already in the lock as a transitive dependency of `jsonschema`,
# so naming it directly adds no crate to the build.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
# MySQL temporal values require proleptic calendar arithmetic and IANA timezone
# transitions. These replace Go's time.Time and time.Location without embedding
# a partial hand-maintained timezone table.
chrono = "0.4"
chrono-tz = "0.10"
# MySQL compressed protocol uses the same two standardized wire codecs as
# TiDB's Go packetio owner. Keep codec choice separate from packet framing.
flate2 = "1"
zstd = "0.13"
crc32fast = "1"
num-traits = "0.2"
# Go's MyDecimal keeps ordinary coefficients inline. Preserve that hot-path
# ownership model in the Rust value layer while retaining heap fallback for
# the full DECIMAL precision range.
smallvec = "1"
# `pkg/util/hack` reaches into Go's private Swiss-map ABI to account for the
# allocation behind a map. Rust's standard HashMap deliberately hides that
# layout. Pin hashbrown, the table implementation, so the Rust transcreation
# can account for its allocation without guessing at std internals.
hashbrown = "=0.15.5"
# Hashbrown's own seedable builder lets `MockSeedForTest` alter the real hash
# distribution, rather than storing a test-only marker disconnected from map
# behavior.
foldhash = "=0.1.5"
# Inbound TLS on the MySQL port (Go's `pkg/server`: `crypto/tls` +
# `tls.LoadX509KeyPair`, with a self-signed pair generated under `auto-tls`).
# rustls is already in this lockfile through the TiKV client's gRPC transport,
# and the `ring` provider it uses is likewise already built, so the MySQL port
# reuses that same TLS stack rather than introducing a second one. `rcgen` is
# the counterpart of Go's `createTLSCertificates`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
# Default features drag in `x509-parser` (for reading an existing CA) which
# this node never does: it only emits one self-signed leaf.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"        # Phase 0 is safe Rust end-to-end.
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# Dev builds include large aggregate integration-test binaries, so full DWARF
# dominates both link time and disk. Line tables keep
# file/line in panics and backtraces at a fraction of the cost.
[profile.dev]
debug = "line-tables-only"

# Third-party dependencies are compiled once and stepped through essentially
# never, so their debug info is pure cost: it inflates every rlib, every test
# binary, and -- on macOS -- the number of code pages the kernel hashes when
# it validates a freshly linked binary on first exec. Our own crates keep
# line tables, so OUR frames still carry file and line in a backtrace.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"

# Benchmarks are rebuilt on every edit while a measurement is in progress, and
# `tidb-executor` alone is 114k lines: thin LTO with release's single codegen
# unit costs about four minutes per edit, for cross-crate optimisation that an
# A/B of the same code shape does not need. Keep release's `opt-level` and let
# the crate compile in parallel.
[profile.bench]
inherits = "release"
lto = false
codegen-units = 16
