[package]
name = "difftest-result-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Result differential tests and the integration-corpus replay engine."
publish = false
autotests = false

[lints]
workspace = true

[dependencies]
difftest = { path = ".." }
tidb-ast = { path = "../../crates/tidb-ast" }
tidb-parser = { path = "../../crates/tidb-parser" }
tidb-expr = { path = "../../crates/tidb-expr" }
tidb-datatype = { path = "../../crates/tidb-datatype" }
tidb-executor = { path = "../../crates/tidb-executor" }
tidb-driver-error = { path = "../../crates/tidb-driver-error" }
tidb-session = { path = "../../crates/tidb-session" }
tidb-memory = { path = "../../crates/tidb-memory" }
tidb-util = { path = "../../crates/tidb-util" }
tidb-server-internal-column = { path = "../../crates/tidb-server-internal-column" }
tidb-format-textrow = { path = "../../crates/tidb-format-textrow" }
tidb-config = { path = "../../crates/tidb-config" }

[[test]]
name = "expr_diff"
path = "tests/expr_diff.rs"

[[test]]
name = "query_diff"
path = "tests/query_diff.rs"

[[test]]
name = "table_diff"
path = "tests/table_diff.rs"

[[test]]
name = "many_table_join"
path = "tests/many_table_join.rs"
